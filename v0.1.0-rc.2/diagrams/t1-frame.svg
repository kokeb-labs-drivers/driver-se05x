<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="t1-frame-title t1-frame-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t1-frame-title">One T=1 block on the bus</title>
<desc id="t1-frame-desc">Two rows of fields: the NXP flavour NAD, PCB, one-byte LEN, INF up to 254 bytes, CRC; the GP flavour NAD, PCB, two-byte LEN, INF up to 4089 bytes, CRC; and the three PCB forms.</desc>
<rect x="0.5" y="0.5" width="1199" height="626" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">TRANSPORT</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">One T=1 block on the bus</text>
<text x="32" y="103.8" font-size="15" fill="#566070">One block is one I2C write; a reply is read after the chip stops NAKing its address.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>

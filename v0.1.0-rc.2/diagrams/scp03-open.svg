<svg xmlns="http://www.w3.org/2000/svg" width="741" height="508" viewBox="0 0 741 508" role="img" aria-labelledby="scp03-open-title scp03-open-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="scp03-open-title">Opening an SCP03 session</title>
<desc id="scp03-open-desc">Opening an SCP03 session: Device::Open sends a host challenge, derives the session keys from the card's reply, checks the card cryptogram and sends EXTERNAL AUTHENTICATE, after which every command and answer is protected.</desc>
<defs><marker id="scp03-open-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>

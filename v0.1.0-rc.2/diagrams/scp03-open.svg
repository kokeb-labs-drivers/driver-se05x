<text x="32" y="54.8" font-size="26" font-weight="700" fill="#0E1726">Opening an SCP03 session</text>
<rect x="32" y="70.8" width="677" height="1" fill="#E2E7EE"/>
<path d="M113.9 144.8 L113.9 494.8" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>

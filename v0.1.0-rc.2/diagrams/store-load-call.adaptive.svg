<svg xmlns="http://www.w3.org/2000/svg" width="869" height="579" viewBox="0 0 869 579" role="img" aria-labelledby="store-load-call-title store-load-call-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="store-load-call-title">Store a secret, load it at every boot</title>
<desc id="store-load-call-desc">Secret storage: Store writes the secret to the chip once, encrypted and MACed, and every boot Load reads it back encrypted and returns it in a SecretBuffer that is wiped when it goes out of scope.</desc>

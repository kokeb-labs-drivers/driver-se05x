<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1168" viewBox="0 0 640 1168" role="img" aria-labelledby="provisioning-flow-title provisioning-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="provisioning-flow-title">The factory provisioning flow</title>
<desc id="provisioning-flow-desc">Flow of factory provisioning: open with the product's platform keys, provision keys, record the identity, install certificates, create counters and store credentials, then either lock the device or ship it unlocked for development.</desc>
<style>
.fk{--fk-amber-strong:#C26A05;--fk-amber-text:#8A3C0B;--fk-amber-tint:#FFF5E3;--fk-blue-strong:#2563EB;--fk-canvas:#FFFFFF;--fk-card:#FFFFFF;--fk-frame:#E2E7EE;--fk-hair:#E2E7EE;--fk-ink:#0E1726;--fk-ink2:#2B3442;--fk-line:#738093;--fk-muted:#566070;--fk-rail:#7C8798;--fk-rose-strong:#DB2752;--fk-slate-strong:#64748B;}

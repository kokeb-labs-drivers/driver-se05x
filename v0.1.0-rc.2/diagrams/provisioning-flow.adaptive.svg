<text x="174" y="115.5" font-size="15" font-weight="700" class="fk-f-ink">Open with the product's platform keys</text>
<text x="174" y="140.4" font-size="13" class="fk-f-ink2">never the vendor defaults</text>
<text x="220" y="254.6" font-size="15" font-weight="700" class="fk-f-ink">CheckPlan, then Provision</text>
<text x="220" y="279.4" font-size="13" class="fk-f-ink2">sign, TLS, agree keys</text>
<text x="245" y="393.6" font-size="15" font-weight="700" class="fk-f-ink">FactoryRecord</text>
<text x="245" y="418.4" font-size="13" class="fk-f-ink2">Identify, public keys,</text>
<text x="245" y="437.3" font-size="13" class="fk-f-ink2">attestation</text>
<text x="206" y="551.5" font-size="15" font-weight="700" class="fk-f-ink">CSR, certificates, trust anchor</text>
<text x="245" y="665.5" font-size="15" font-weight="700" class="fk-f-ink">CreateCounter</text>
<text x="245" y="690.4" font-size="13" class="fk-f-ink2">anti-rollback floors</text>
<text x="245" y="804.5" font-size="15" font-weight="700" class="fk-f-ink">Store</text>
<text x="245" y="829.4" font-size="13" class="fk-f-ink2">network credentials</text>
<text x="245" y="943.5" font-size="15" font-weight="700" class="fk-f-amber-text">Lock?</text>
<text x="122" y="1057.5" font-size="15" font-weight="700" class="fk-f-ink">Irreversible</text>
<text x="122" y="1082.4" font-size="13" class="fk-f-ink2">RequirePlatformScp,</text>
<text x="122" y="1101.2" font-size="13" class="fk-f-ink2">SetLockStatePersistent,</text>
<text x="122" y="1120.1" font-size="13" class="fk-f-ink2">DisableObjectCreation</text>
<text x="368" y="1076.5" font-size="15" font-weight="700" class="fk-f-ink">Ship unlocked</text>
<text x="368" y="1101.4" font-size="13" class="fk-f-ink2">development only</text>
<rect x="247.1" y="971" width="126.8" height="20" rx="10" class="fk-f-canvas"/>
<text x="310.5" y="985.3" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">plan, read, confirm</text>
<rect x="394.9" y="1000.6" width="54.2" height="20" rx="10" class="fk-f-canvas"/>
<text x="422" y="1015" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">not yet</text>
</svg>

<path d="M595.3 268.8 L117.9 268.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#scp03-open-arrow-rail)"/>
<path d="M117.9 312.8 L412 312.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scp03-open-arrow-rail)"/>
<path d="M117.9 408.8 L595.3 408.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scp03-open-arrow-rail)"/>

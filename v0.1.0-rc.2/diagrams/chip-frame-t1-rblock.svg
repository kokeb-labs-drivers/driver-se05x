<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="582" viewBox="0 0 1200 582" role="img" aria-labelledby="chip-frame-t1-rblock-title chip-frame-t1-rblock-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-t1-rblock-title">SE05x: T=1 R-block (acknowledgement)</title>
<desc id="chip-frame-t1-rblock-desc">T=1 R-block (acknowledgement) of the SE05x, 40 bits, most significant bit first. Host to chip: DAD (bits 39 to 36), SAD (bits 35 to 32), PCB (bits 31 to 24), LEN 0x00 (bits 23 to 16), CRC16 (bits 15 to 0); Chip to host: DAD (bits 39 to 36), SAD (bits 35 to 32), PCB (bits 31 to 24), LEN 0x00 (bits 23 to 16), CRC16 (bits 15 to 0). The PCB field of the Host to chip row: bit 7 1 (R-block), bit 6 0 (R-block), bit 5 0 (reserved), bit 4 N(R), bit 3 0 (reserved), bit 2 0 (reserved), bit 1 error code, high, bit 0 error code, low.</desc>
<rect x="0.5" y="0.5" width="1199" height="581" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">SE05x: T=1 R-block (acknowledgement)</text>
<text x="32" y="115.4" font-size="18" fill="#566070">Every T=1 block is a prologue (NAD, PCB, LEN), up to LEN bytes of APDU and a CRC16; an R-block has no data, so it is five</text>
<text x="32" y="141.5" font-size="18" fill="#566070">bytes. The GlobalPlatform flavour has a two-byte LEN. 40 bits, sent most significant bit first. Datasheet: UM11225 2.1 T=1</text>
<text x="32" y="167.6" font-size="18" fill="#566070">Block Frame Format, Tables 1 to 4, p. 5.</text>
<rect x="32" y="183.6" width="1136" height="1" fill="#E2E7EE"/>

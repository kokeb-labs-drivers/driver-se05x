<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="982" viewBox="0 0 1200 982" role="img" aria-labelledby="variant-decision-title variant-decision-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="variant-decision-title">Choosing a variant, an applet and an authentication</title>
<desc id="variant-decision-desc">Decision tree: FIPS 140-3 leads to SE052F, FIPS 140-2 to SE050F, NFC and Matter to SE051H, UWB to SE051W, field updates to SE051A or C, else SE050E, C, A, B or D by algorithms; then platform SCP03, ECKey or UserID sessions.</desc>

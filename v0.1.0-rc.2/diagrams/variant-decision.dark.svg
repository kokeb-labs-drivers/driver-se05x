<text x="154" y="947.8" font-size="12.5" fill="#9AA6B5">variant</text>
<rect x="220.7" y="936.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="242.7" y="947.8" font-size="12.5" fill="#9AA6B5">authentication</text>

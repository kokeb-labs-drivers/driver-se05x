<text x="52" y="164.6" font-size="15" font-weight="700" fill="#F8D27A">FIPS 140-3 Level 3 needed?</text>
<text x="808" y="164.6" font-size="15" font-weight="700" fill="#A7F3E6">SE052F</text>
<text x="808" y="189.4" font-size="13" fill="#D2DAE4">applet 7.2.22, HVQFN20, no ENA</text>
<rect x="673.2" y="156.1" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="170.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<text x="52" y="240.6" font-size="15" font-weight="700" fill="#F8D27A">FIPS 140-2, SCP03 always on?</text>
<text x="808" y="240.6" font-size="15" font-weight="700" fill="#A7F3E6">SE050F</text>
<text x="808" y="265.4" font-size="13" fill="#D2DAE4">applet 3.6.0</text>
<rect x="673.2" y="232.1" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="246.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<rect x="102.3" y="187.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="202.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="52" y="316.6" font-size="15" font-weight="700" fill="#F8D27A">NFC commissioning or Matter PAKE?</text>
<text x="808" y="316.6" font-size="15" font-weight="700" fill="#A7F3E6">SE051H</text>
<text x="808" y="341.4" font-size="13" fill="#D2DAE4">applet 7.x</text>
<rect x="673.2" y="308.1" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="322.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<rect x="102.3" y="263.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="278.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="52" y="392.6" font-size="15" font-weight="700" fill="#F8D27A">UWB?</text>
<text x="808" y="392.6" font-size="15" font-weight="700" fill="#A7F3E6">SE051W</text>
<text x="808" y="417.4" font-size="13" fill="#D2DAE4">applet 7.x</text>
<rect x="673.2" y="384.1" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="398.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<rect x="102.3" y="339.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="354.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="52" y="468.6" font-size="15" font-weight="700" fill="#F8D27A">Field update of the applet?</text>
<text x="808" y="468.6" font-size="15" font-weight="700" fill="#A7F3E6">SE051A or SE051C</text>
<text x="808" y="493.4" font-size="13" fill="#D2DAE4">applet 6.0 or 7.2, SEMS Lite</text>
<rect x="673.2" y="460.1" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="474.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<rect x="102.3" y="415.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="430.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="52" y="544.5" font-size="15" font-weight="700" fill="#F8D27A">AES-GCM or CCM, Curve448?</text>
<text x="808" y="544.5" font-size="15" font-weight="700" fill="#A7F3E6">SE050E</text>
<text x="808" y="569.4" font-size="13" fill="#D2DAE4">applet 7.2, 1 MHz without stretching</text>
<rect x="673.2" y="536" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="550.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<rect x="102.3" y="491.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="506.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="52" y="620.5" font-size="15" font-weight="700" fill="#F8D27A">ECC and RSA, more cloud keys?</text>
<text x="808" y="620.5" font-size="15" font-weight="700" fill="#A7F3E6">SE050C</text>
<text x="808" y="645.4" font-size="13" fill="#D2DAE4">applet 3.x</text>
<rect x="673.2" y="612" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="626.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<rect x="102.3" y="567.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="582.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="52" y="696.5" font-size="15" font-weight="700" fill="#F8D27A">RSA only? DESFire?</text>
<text x="808" y="696.5" font-size="15" font-weight="700" fill="#A7F3E6">SE050B or SE050D</text>
<text x="808" y="721.4" font-size="13" fill="#D2DAE4">applet 3.x</text>
<rect x="673.2" y="688" width="33.6" height="20" rx="10" fill="#0E131A"/>
<text x="690" y="702.4" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">yes</text>
<rect x="102.3" y="643.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="658.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="52" y="772.5" font-size="15" font-weight="700" fill="#F8D27A">Otherwise</text>
<rect x="102.3" y="719.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="116" y="734.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">no</text>
<text x="808" y="772.5" font-size="15" font-weight="700" fill="#A7F3E6">SE050A</text>
<text x="808" y="797.4" font-size="13" fill="#D2DAE4">ECC only, applet 3.x</text>
<text x="52" y="878.5" font-size="15" font-weight="700" fill="#DDD6FE">Platform SCP03</text>
<text x="52" y="903.4" font-size="13" fill="#D2DAE4">whenever the I2C bus can be probed</text>
<text x="437.3" y="878.5" font-size="15" font-weight="700" fill="#DDD6FE">ECKey session</text>
<text x="437.3" y="903.4" font-size="13" fill="#D2DAE4">bind one host to the chip</text>
<text x="822.7" y="878.5" font-size="15" font-weight="700" fill="#DDD6FE">UserID session</text>
<text x="822.7" y="903.4" font-size="13" fill="#D2DAE4">trusted host OS only: no secure messaging</text>

<text x="54" y="492.8" font-size="12.5" fill="#9AA6B5">secure object</text>
<rect x="163.5" y="481.2" width="14" height="14" rx="4" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<text x="185.5" y="492.8" font-size="12.5" fill="#9AA6B5">policy</text>
<rect x="246.9" y="481.2" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="268.9" y="492.8" font-size="12.5" fill="#9AA6B5">session</text>
</svg>

<rect x="444" y="385.8" width="4" height="72" rx="2" fill="#94A3B8"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#BFDBFE">Secure object</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">ObjectId: 4 bytes, big endian</text>
<text x="52" y="208.2" font-size="13" fill="#D2DAE4">class: EcKeyPair, EcPrivKey, EcPubKey,</text>
<text x="52" y="227.1" font-size="13" fill="#D2DAE4">RsaKeyPair, RsaPrivKey, ...</text>
<text x="52" y="245.9" font-size="13" fill="#D2DAE4">lifetime: Persistent, TransientReset,</text>
<text x="52" y="264.8" font-size="13" fill="#D2DAE4">TransientDeselect</text>
<text x="52" y="283.6" font-size="13" fill="#D2DAE4">origin: External, Internal, Provisioned</text>
<text x="464" y="164.6" font-size="15" font-weight="700" fill="#DDD6FE">Policy set</text>
<text x="464" y="189.4" font-size="13" fill="#D2DAE4">per policy: auth object id + 4-byte rule</text>
<text x="464" y="208.2" font-size="13" fill="#D2DAE4">header</text>
<text x="464" y="227.1" font-size="13" fill="#D2DAE4">29 rules in the contract, e.g. ForbidAll,</text>
<text x="464" y="245.9" font-size="13" fill="#D2DAE4">Sign, Verify, KeyAgreement</text>
<text x="464" y="264.8" font-size="13" fill="#D2DAE4">9 to 53 bytes each; built by PolicyBuilder</text>
<text x="464" y="283.6" font-size="13" fill="#D2DAE4">only</text>
<text x="876" y="164.6" font-size="15" font-weight="700" fill="#BFDBFE">Authentication object</text>
<text x="876" y="189.4" font-size="13" fill="#D2DAE4">UserID, AESKey (SCP03) or ECKey</text>
<text x="876" y="208.2" font-size="13" fill="#D2DAE4">or a reserved one: Transport,</text>
<text x="876" y="227.1" font-size="13" fill="#D2DAE4">PlatformScp, Feature, FactoryReset</text>
<text x="876" y="404.6" font-size="15" font-weight="700" fill="#A7F3E6">Session</text>
<text x="876" y="429.4" font-size="13" fill="#D2DAE4">CreateSession: 8-byte id</text>
<text x="876" y="448.3" font-size="13" fill="#D2DAE4">at most 2 open, plus the default</text>
<text x="464" y="404.6" font-size="15" font-weight="700" fill="#E2E8F0">Command</text>
<text x="464" y="429.4" font-size="13" fill="#D2DAE4">the chip checks the object's policy</text>
<text x="464" y="448.3" font-size="13" fill="#D2DAE4">for the session's auth object</text>
<rect x="377.1" y="209.3" width="33.7" height="20" rx="10" fill="#0E131A"/>
<text x="394" y="223.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">has</text>
<rect x="779.8" y="195.3" width="52.5" height="20" rx="10" fill="#0E131A"/>
<text x="806" y="209.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">names</text>
<rect x="987.2" y="301.3" width="49.5" height="20" rx="10" fill="#0E131A"/>
<text x="1012" y="315.6" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">opens</text>
<rect x="786.5" y="411.8" width="39.1" height="20" rx="10" fill="#0E131A"/>
<text x="806" y="426.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">runs</text>
<rect x="241.8" y="411.8" width="27.3" height="20" rx="10" fill="#0E131A"/>
<text x="255.5" y="426.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">on</text>

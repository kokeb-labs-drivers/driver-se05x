<text x="54" y="492.8" font-size="12.5" fill="#566070">secure object</text>
<rect x="163.5" y="481.2" width="14" height="14" rx="4" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<text x="185.5" y="492.8" font-size="12.5" fill="#566070">policy</text>
<rect x="246.9" y="481.2" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="268.9" y="492.8" font-size="12.5" fill="#566070">session</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="527" viewBox="0 0 1200 527" role="img" aria-labelledby="object-policy-title object-policy-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="object-policy-title">Objects, policies and sessions</title>
<desc id="object-policy-desc">An authentication object opens a session; a policy of an object names that authentication object and the rules it allows; the chip checks the policy on every command.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker><marker id="fk-arrow-slate-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="526" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">OBJECT MODEL</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Objects, policies and sessions</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The chip enforces the policy; the host never decides access.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
<path d="M348 219.3 L440 219.3" fill="none" stroke="#8893A2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>

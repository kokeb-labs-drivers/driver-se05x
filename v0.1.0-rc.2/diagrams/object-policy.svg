<text x="806" y="426.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">runs</text>
<rect x="241.8" y="411.8" width="27.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="255.5" y="426.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">on</text>

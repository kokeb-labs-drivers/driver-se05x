<rect x="444" y="385.8" width="4" height="72" rx="2" fill="#64748B"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#1E429F">Secure object</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">ObjectId: 4 bytes, big endian</text>
<text x="52" y="208.2" font-size="13" fill="#2B3442">class: EcKeyPair, EcPrivKey, EcPubKey,</text>
<text x="52" y="227.1" font-size="13" fill="#2B3442">RsaKeyPair, RsaPrivKey, ...</text>
<text x="52" y="245.9" font-size="13" fill="#2B3442">lifetime: Persistent, TransientReset,</text>
<text x="52" y="264.8" font-size="13" fill="#2B3442">TransientDeselect</text>
<text x="52" y="283.6" font-size="13" fill="#2B3442">origin: External, Internal, Provisioned</text>
<text x="464" y="164.6" font-size="15" font-weight="700" fill="#5B21B6">Policy set</text>
<text x="464" y="189.4" font-size="13" fill="#2B3442">per policy: auth object id + 4-byte rule</text>
<text x="464" y="208.2" font-size="13" fill="#2B3442">header</text>
<text x="464" y="227.1" font-size="13" fill="#2B3442">29 rules in the contract, e.g. ForbidAll,</text>
<text x="464" y="245.9" font-size="13" fill="#2B3442">Sign, Verify, KeyAgreement</text>
<text x="464" y="264.8" font-size="13" fill="#2B3442">9 to 53 bytes each; built by PolicyBuilder</text>
<text x="464" y="283.6" font-size="13" fill="#2B3442">only</text>
<text x="876" y="164.6" font-size="15" font-weight="700" fill="#1E429F">Authentication object</text>
<text x="876" y="189.4" font-size="13" fill="#2B3442">UserID, AESKey (SCP03) or ECKey</text>
<text x="876" y="208.2" font-size="13" fill="#2B3442">or a reserved one: Transport,</text>
<text x="876" y="227.1" font-size="13" fill="#2B3442">PlatformScp, Feature, FactoryReset</text>
<text x="876" y="404.6" font-size="15" font-weight="700" fill="#0B5F59">Session</text>
<text x="876" y="429.4" font-size="13" fill="#2B3442">CreateSession: 8-byte id</text>
<text x="876" y="448.3" font-size="13" fill="#2B3442">at most 2 open, plus the default</text>
<text x="464" y="404.6" font-size="15" font-weight="700" fill="#334155">Command</text>
<text x="464" y="429.4" font-size="13" fill="#2B3442">the chip checks the object's policy</text>
<text x="464" y="448.3" font-size="13" fill="#2B3442">for the session's auth object</text>
<rect x="377.1" y="209.3" width="33.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="394" y="223.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">has</text>
<rect x="779.8" y="195.3" width="52.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="806" y="209.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">names</text>

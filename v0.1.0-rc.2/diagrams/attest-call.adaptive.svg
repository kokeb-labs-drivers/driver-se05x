<svg xmlns="http://www.w3.org/2000/svg" width="786" height="499" viewBox="0 0 786 499" role="img" aria-labelledby="attest-call-title attest-call-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="attest-call-title">An attested read</title>
<desc id="attest-call-desc">An attested read: the facade draws a fresh nonce, asks the chip to read the object with attestation, and checks the command hash, the signature, a later timestamp and the unique id on the host before it returns a Verified result.</desc>
<style>

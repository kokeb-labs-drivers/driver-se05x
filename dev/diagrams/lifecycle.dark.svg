<text x="600" y="286.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">DeleteAll</text>
<rect x="32" y="641.2" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="54" y="652.8" font-size="12.5" fill="#9AA6B5">reversible</text>
<rect x="140.1" y="641.2" width="14" height="14" rx="4" fill="#321820" stroke="#FB7185" stroke-width="1.4"/>
<text x="162.1" y="652.8" font-size="12.5" fill="#9AA6B5">irreversible: Plan and Confirmation</text>
<rect x="402.7" y="641.2" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="424.7" y="652.8" font-size="12.5" fill="#9AA6B5">ends the session</text>

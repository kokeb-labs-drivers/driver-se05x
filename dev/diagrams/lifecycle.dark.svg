<text x="470" y="364.6" font-size="15" font-weight="700" fill="#A7F3E6">In use</text>
<text x="470" y="389.4" font-size="13" fill="#D2DAE4">objects per their policies</text>
<text x="470" y="408.3" font-size="13" fill="#D2DAE4">ReadState any time</text>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#E2E8F0">Transport locked</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">Transport role: SetLockState</text>
<text x="52" y="208.2" font-size="13" fill="#D2DAE4">only 5 commands answered</text>
<text x="888" y="164.6" font-size="15" font-weight="700" fill="#FECDD3">Platform SCP required</text>
<text x="888" y="189.4" font-size="13" fill="#D2DAE4">PlatformScp role</text>
<text x="888" y="208.2" font-size="13" fill="#D2DAE4">full SCP03 from then on</text>
<text x="52" y="564.5" font-size="15" font-weight="700" fill="#FECDD3">Creation restricted</text>
<text x="52" y="589.4" font-size="13" fill="#D2DAE4">DisableObjectCreation</text>
<text x="52" y="608.2" font-size="13" fill="#D2DAE4">persistent: cannot be undone</text>
<text x="888" y="564.5" font-size="15" font-weight="700" fill="#FECDD3">Features changed</text>
<text x="888" y="589.4" font-size="13" fill="#D2DAE4">Feature role (ECKey)</text>
<text x="888" y="608.2" font-size="13" fill="#D2DAE4">SetAppletFeatures</text>
<text x="470" y="164.6" font-size="15" font-weight="700" fill="#FDE68A">Factory reset</text>
<text x="470" y="189.4" font-size="13" fill="#D2DAE4">FactoryReset role: DeleteAll</text>
<text x="470" y="208.2" font-size="13" fill="#D2DAE4">provisioned objects stay</text>
<rect x="154.8" y="354.2" width="184.1" height="20" rx="10" fill="#0E131A"/>
<text x="246.8" y="368.5" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">lock (transient or persistent)</text>
<rect x="108.8" y="393.8" width="146.3" height="20" rx="10" fill="#0E131A"/>
<text x="182" y="408.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">unlock: Transport role</text>

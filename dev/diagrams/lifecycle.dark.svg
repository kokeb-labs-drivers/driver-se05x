<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="687" viewBox="0 0 1200 687" role="img" aria-labelledby="lifecycle-title lifecycle-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="lifecycle-title">Lifecycle settings and the roles that change them</title>
<desc id="lifecycle-desc">Central card: the chip in normal use. Around it: transport locked, platform SCP required, object creation restricted, applet features changed and factory reset, each reached by one command from one reserved role; irreversible ones in red.</desc>

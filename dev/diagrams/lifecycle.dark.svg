<text x="255.6" y="421.3" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">restrict</text>
<rect x="902" y="407" width="84.8" height="20" rx="10" fill="#0E131A"/>
<text x="944.4" y="421.3" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">set features</text>

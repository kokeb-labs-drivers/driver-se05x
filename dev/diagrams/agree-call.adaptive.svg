<text x="765.3" y="303.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">ECDHGenerateSharedSecret (encrypted both ways)</text>
<rect x="665" y="332.8" width="200.6" height="20" rx="10" class="fk-f-canvas"/>
<text x="765.3" y="347.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">shared secret (R-ENC, R-MAC)</text>

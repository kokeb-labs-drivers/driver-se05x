<text x="434" y="391.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">SecretBuffer, wiped on failure and at scope end</text>
<text x="218.6" y="453.9" font-size="13" class="fk-f-amber-text">HKDF, then AES-GCM with the derived key</text>

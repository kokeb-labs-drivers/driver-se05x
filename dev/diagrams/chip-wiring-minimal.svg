<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="744" viewBox="0 0 1200 744" role="img" aria-labelledby="chip-wiring-minimal-title chip-wiring-minimal-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-wiring-minimal-title">Wiring: Minimal application, no power cycle (SE050, SE051)</title>
<desc id="chip-wiring-minimal-desc">Wiring of the SE05x for the Minimal application, no power cycle (SE050, SE051): MCU I2C SDA to SDA (Write() / Read()); MCU I2C SCL to SCL (Write() / Read()). Supplies, grounds and the support parts are listed under the drawing.</desc>
<rect x="0.5" y="0.5" width="1199" height="743" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#7A360E">PINS AND WIRING</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">Wiring: Minimal application, no power cycle (SE050, SE051)</text>
<text x="32" y="115.4" font-size="18" fill="#566070">What you connect by hand, with the driver hook on each MCU wire. The full schematic, with every part and value, is on the</text>
<text x="32" y="141.5" font-size="18" fill="#566070">Hardware page. Datasheet: Table 5 Pin description HX2QFN20, p. 11.</text>
<rect x="32" y="157.5" width="1136" height="1" fill="#E2E7EE"/>
<path d="M478.6 280.3 L667.4 280.3" fill="none" stroke="#2563EB" stroke-width="2.2"/>
<path d="M478.6 365.9 L667.4 365.9" fill="none" stroke="#2563EB" stroke-width="2.2"/>
<rect x="681.4" y="175.5" width="240" height="251.2" rx="10" fill="#F5F7FA" stroke="#2B3442" stroke-width="2.2"/>
<rect x="278.6" y="175.5" width="200" height="251.2" rx="12" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="32" y="454.7" width="1136" height="79" rx="12" fill="#FFEEF2" stroke="#F5BECB" stroke-width="1"/>
<rect x="32" y="547.7" width="1136" height="103.6" rx="12" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="801.4" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#0E1726">SE05x</text>
<text x="801.4" y="232.9" font-size="16" text-anchor="middle" fill="#566070">U1</text>
<text x="296.6" y="210.5" font-size="20" font-weight="700" fill="#1E429F">MCU</text>
<text x="296.6" y="232.9" font-size="16" fill="#1E429F">U2</text>
<text x="460.6" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">I2C SDA</text>
<text x="703.4" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SDA</text>
<rect x="667.4" y="274.3" width="14" height="12" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="573" y="270.3" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">SDA  pin 9</text>
<text x="573" y="303.1" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Write() / Read()</text>
<text x="573" y="324.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R1 3.3 kΩ</text>
<text x="460.6" y="371.7" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#1E429F">I2C SCL</text>
<text x="703.4" y="371.7" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#0E1726">SCL</text>
<rect x="667.4" y="359.9" width="14" height="12" rx="2" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="573" y="355.9" font-size="16" font-weight="600" text-anchor="middle" fill="#2B3442">SCL  pin 10</text>
<text x="573" y="388.7" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">Write() / Read()</text>
<text x="573" y="410.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#566070">+ R2 3.3 kΩ</text>
<text x="50" y="489.7" font-size="20" font-weight="700" fill="#9F1239">Supplies and ground</text>
<text x="50" y="513.1" font-size="17" fill="#9F1239">+3V3: ENA, RST_N, VCC, VIN; also U2.VDD · GND: VSS, VSS_EP; also U2.GND</text>
<text x="50" y="582.7" font-size="20" font-weight="700" fill="#334155">Also on the board</text>
<text x="50" y="606.1" font-size="17" fill="#334155">Support parts: 1 capacitor, 2 resistors around the supplies (values in the full schematic). Not wired in this circuit (6): LA, LB, CLK,</text>
<text x="50" y="630.8" font-size="17" fill="#334155">IO1, IO2, VOUT.</text>
<text x="32" y="676.8" font-size="16" fill="#566070">* Not confirmed in the datasheet: C1: a usual decoupling value; the SE050 data sheet gives none.</text>
<rect x="32" y="694" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="54" y="708.6" font-size="16" fill="#566070">bus</text>
</svg>

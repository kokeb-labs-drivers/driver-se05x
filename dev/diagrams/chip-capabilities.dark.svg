<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1134" viewBox="0 0 1200 1134" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the SE05x does</title>
<desc id="chip-capabilities-desc">Capability map of the SE05x: Key generation (supported): Generates EC key pairs inside the chip under a policy; the private key never leaves it; Signatures and key agreement (supported): ECDSA signatures and verification and ECDH shared secrets with keys held in the chip; Attestation (supported): Proves a key or a value comes from this chip: a signed, fresh read with the chip's unique ID; Secure storage (supported): Binary objects for secrets such as a Wi-Fi passphrase or a token, read only as their policy allows; Certificates and CSR (supported): Stores and reads certificates, builds a certificate request for a chip key and checks a chain; Monotonic counters (supported): Counters that only count up, for an anti-rollback floor on the firmware version; Secure channels (supported): Platform SCP03 encrypts the bus; AESKey, ECKey and UserID sessions authenticate the caller; Lifecycle and locks (guarded): Transport lock, a platform SCP03 requirement and factory reset: one-way changes to the chip; Contactless and ISO 7816 (not covered): The ISO 14443 antenna and ISO 7816 interfaces; the host cannot reach them over I2C.</desc>

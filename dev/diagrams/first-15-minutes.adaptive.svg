<text x="198" y="115.5" font-size="15" font-weight="700" class="fk-f-ink">Run the host example</text>
<text x="198" y="140.4" font-size="13" class="fk-f-ink2">no hardware</text>
<rect x="378.3" y="98.8" width="74.7" height="21.5" rx="10.8" stroke-width="1" class="fk-f-green-tint fk-s-green-soft"/>
<text x="386.3" y="113.2" font-size="11.5" font-weight="700" class="fk-f-green-text">0 to 3 min</text>
<text x="220" y="230.6" font-size="15" font-weight="700" class="fk-f-ink">Read what it did</text>
<text x="220" y="255.4" font-size="13" class="fk-f-ink2">no hardware</text>
<rect x="355.6" y="213.8" width="74.4" height="21.5" rx="10.8" stroke-width="1" class="fk-f-green-tint fk-s-green-soft"/>
<text x="363.6" y="228.2" font-size="11.5" font-weight="700" class="fk-f-green-text">3 to 6 min</text>
<text x="228" y="345.6" font-size="15" font-weight="700" class="fk-f-ink">Wire the chip</text>
<rect x="344" y="328.8" width="77" height="21.5" rx="10.8" stroke-width="1" class="fk-f-amber-tint fk-s-amber-soft"/>
<text x="352" y="343.2" font-size="11.5" font-weight="700" class="fk-f-amber-text">6 to 11 min</text>
<text x="180" y="435.6" font-size="15" font-weight="700" class="fk-f-ink">Flash the ESP32 example</text>

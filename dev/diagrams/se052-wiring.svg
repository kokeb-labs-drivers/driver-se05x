<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Wiring the SE052</text>
<text x="32" y="103.8" font-size="15" fill="#566070">SE052 data sheet Rev. 1.5: Figure 1 (p. 6) and Table 2 (p. 4).</text>

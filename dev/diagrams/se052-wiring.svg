<rect x="32" y="277.8" width="260" height="125" rx="10" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<rect x="32" y="285.8" width="4" height="109" rx="2" fill="#64748B"/>
<rect x="372" y="137.8" width="300" height="88" rx="10" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<rect x="372" y="145.8" width="4" height="72" rx="2" fill="#2563EB"/>
<rect x="838" y="277.8" width="330" height="144" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="838" y="285.8" width="4" height="128" rx="2" fill="#0B7A72"/>
<rect x="372" y="467.8" width="300" height="88" rx="10" fill="#FFFFFF" stroke="#C9D1DB" stroke-width="1" stroke-dasharray="6 4"/>
<rect x="32" y="585.8" width="1136" height="79.3" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="52" y="304.6" font-size="15" font-weight="700" fill="#334155">MCU</text>
<text x="52" y="329.4" font-size="13" fill="#2B3442">I2C SDA</text>
<text x="52" y="348.2" font-size="13" fill="#2B3442">I2C SCL</text>
<text x="52" y="367.1" font-size="13" fill="#2B3442">GPIO (reset port)</text>
<text x="52" y="385.9" font-size="13" fill="#2B3442">3V3, GND</text>
<text x="392" y="164.6" font-size="15" font-weight="700" fill="#1E429F">Pull-ups to the bus supply</text>
<text x="392" y="189.4" font-size="13" fill="#2B3442">SDA and SCL, value per bus speed</text>
<text x="392" y="208.2" font-size="13" fill="#2B3442">bus supply 1.65 V to 3.6 V</text>
<text x="858" y="304.6" font-size="15" font-weight="700" fill="#0B5F59">SE052</text>
<text x="858" y="329.4" font-size="13" fill="#2B3442">11 SDA, 10 SCL</text>
<text x="858" y="348.2" font-size="13" fill="#2B3442">12 VIN: bus supply</text>
<text x="858" y="367.1" font-size="13" fill="#2B3442">15 VOUT to 18 VDD</text>
<text x="858" y="385.9" font-size="13" fill="#2B3442">14 RST_N</text>
<text x="858" y="404.8" font-size="13" fill="#2B3442">19 VSS</text>
<text x="392" y="494.6" font-size="15" font-weight="700" fill="#0E1726">Capacitors (optional)</text>
<text x="392" y="519.4" font-size="13" fill="#2B3442">22 nF on VIN</text>
<text x="392" y="538.2" font-size="13" fill="#2B3442">22 nF or none on VOUT, at most 47 nF</text>
<rect x="529.8" y="301.4" width="70.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="565" y="315.7" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">SDA, SCL</text>
<rect x="538.9" y="355.7" width="52.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="565" y="370" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">RST_N</text>
<rect x="857.8" y="171.8" width="55.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="885.5" y="186.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">pull-up</text>
<rect x="843.6" y="501.8" width="77.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="882.5" y="516.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">VIN, VOUT</text>
<text x="46" y="612.5" font-size="15" font-weight="700" fill="#334155">Unused pins</text>
<text x="46" y="630.4" font-size="13" fill="#334155">Unused: CLK (13) open or to ground, LA (17) and LB (1) open, IO1 (3) and IO2 (16) open when the chip's own I2C controller is not used. The limit of 47 nF on VOUT is Table</text>
<text x="46" y="649.2" font-size="13" fill="#334155">6, p. 8.</text>
<rect x="32" y="680.5" width="14" height="14" rx="4" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.4"/>
<text x="54" y="692.2" font-size="12.5" fill="#566070">bus</text>
<rect x="100.9" y="680.5" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="122.9" y="692.2" font-size="12.5" fill="#566070">supply</text>
<rect x="188.7" y="680.5" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="210.7" y="692.2" font-size="12.5" fill="#566070">control</text>
<rect x="278.5" y="680.5" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="300.5" y="692.2" font-size="12.5" fill="#566070">optional part</text>
</svg>

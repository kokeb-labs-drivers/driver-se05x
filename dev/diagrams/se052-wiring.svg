<path d="M676 181.8 L995 181.8 Q1003 181.8 1003 189.8 L1003 273.8" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-blue-strong)"/>

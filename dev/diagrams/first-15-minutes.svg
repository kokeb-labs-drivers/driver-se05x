<svg xmlns="http://www.w3.org/2000/svg" width="640" height="483" viewBox="0 0 640 483" role="img" aria-labelledby="first-15-minutes-title first-15-minutes-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="first-15-minutes-title">The first 15 minutes</title>
<desc id="first-15-minutes-desc">The first 15 minutes in four steps: run the host example in minutes 0 to 3, read what it did to minute 6, wire the chip to minute 11 and flash the ESP32 example to minute 15.</desc>

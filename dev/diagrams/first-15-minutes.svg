<rect x="208" y="318.8" width="223" height="44" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1"/>
<rect x="208" y="326.8" width="4" height="28" rx="2" fill="#C26A05"/>
<rect x="160" y="408.8" width="320" height="44" rx="10" fill="#FFFFFF" stroke="#738093" stroke-width="1"/>

<text x="386.3" y="113.2" font-size="11.5" font-weight="700" fill="#14532D">0 to 3 min</text>
<text x="220" y="230.6" font-size="15" font-weight="700" fill="#0E1726">Read what it did</text>
<text x="220" y="255.4" font-size="13" fill="#2B3442">no hardware</text>
<rect x="355.6" y="213.8" width="74.4" height="21.5" rx="10.8" fill="#EAF7EF" stroke="#B2E2C2" stroke-width="1"/>
<text x="363.6" y="228.2" font-size="11.5" font-weight="700" fill="#14532D">3 to 6 min</text>

<path d="M325 312.8 L108.6 312.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#csr-flow-arrow-rail)"/>
<path d="M108.6 356.8 L325 356.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#csr-flow-arrow-rail)"/>

<text x="32" y="54.8" font-size="26" font-weight="700" fill="#0E1726">From a device key to a stored certificate</text>
<rect x="32" y="70.8" width="1065" height="1" fill="#E2E7EE"/>
<path d="M104.6 144.8 L104.6 530.8" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>

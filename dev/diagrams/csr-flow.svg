<text x="107.6" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#86198F">Your CA</text>
<text x="332" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#86198F">Factory station</text>
<text x="599.6" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#86198F">Device firmware</text>
<text x="1027.4" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#8A3C0B">SE05x</text>
<rect x="680.5" y="156.8" width="259.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="810.5" y="171.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">generate the device key (inside the chip)</text>
<rect x="707.1" y="200.8" width="206.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="810.5" y="215.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">sign the CSR body (ECDSASign)</text>
<rect x="337" y="244.8" width="251.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="462.8" y="259.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">CSR with the unique id as serialNumber</text>
<rect x="197.9" y="288.8" width="37.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="216.8" y="303.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">CSR</text>
<rect x="112.6" y="332.8" width="208.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="216.8" y="347.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">device certificate, CA certificate</text>
<rect x="407.1" y="376.8" width="111.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="462.8" y="391.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">both certificates</text>
<rect x="604.6" y="420.8" width="411.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="810.5" y="435.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">WriteBinary: certificate and trust anchor (nobody may write them)</text>
<text x="540.6" y="497.9" font-size="13" fill="#8A3C0B">every boot: read both back, verify the chain</text>
</svg>

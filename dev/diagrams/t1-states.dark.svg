<title id="t1-states-title">The T=1 link: states and S-blocks</title>
<desc id="t1-states-desc">State diagram of t1::Link: Closed, Idle, InFlight, NeedsReselect and Dead, with the S-blocks handled while a command is in flight.</desc>

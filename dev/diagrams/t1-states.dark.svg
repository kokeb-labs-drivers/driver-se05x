<text x="52" y="164.6" font-size="15" font-weight="700" fill="#E2E8F0">Closed</text>
<text x="52" y="189.4" font-size="13" fill="#D2DAE4">before Open(), after Close()</text>
<text x="354" y="164.6" font-size="15" font-weight="700" fill="#A7F3E6">Idle</text>
<text x="354" y="189.4" font-size="13" fill="#D2DAE4">open, nothing in flight</text>
<text x="656" y="164.6" font-size="15" font-weight="700" fill="#A7F3E6">InFlight</text>
<text x="656" y="189.4" font-size="13" fill="#D2DAE4">one command exchanged</text>
<text x="656" y="354.6" font-size="15" font-weight="700" fill="#FDE68A">NeedsReselect</text>
<text x="656" y="379.4" font-size="13" fill="#D2DAE4">chip context was reset</text>
<text x="656" y="544.5" font-size="15" font-weight="700" fill="#FECDD3">Dead</text>
<text x="656" y="569.4" font-size="13" fill="#D2DAE4">ladder spent</text>
<rect x="270.9" y="162.3" width="54.1" height="20" rx="10" fill="#0E131A"/>

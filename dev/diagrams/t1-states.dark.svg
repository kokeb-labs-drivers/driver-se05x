<text x="926" y="189.4" font-size="13" fill="#D2DAE4">S(WTX) C3 answered E3, counted</text>
<text x="926" y="208.2" font-size="13" fill="#D2DAE4">by wtx_limit</text>
<text x="926" y="227.1" font-size="13" fill="#D2DAE4">R-block error: resend, at most</text>
<text x="926" y="245.9" font-size="13" fill="#D2DAE4">frame_retries</text>
<text x="926" y="264.8" font-size="13" fill="#D2DAE4">chaining: M bit, R(N(R)) per part</text>
<text x="926" y="283.6" font-size="13" fill="#D2DAE4">S(IFS) C1, S(ABORT) C2,</text>
<text x="926" y="302.5" font-size="13" fill="#D2DAE4">S(RESYNC) C0</text>
<text x="926" y="321.3" font-size="13" fill="#D2DAE4">interface soft reset CF: context</text>
<text x="926" y="340.2" font-size="13" fill="#D2DAE4">reset</text>
<text x="926" y="359" font-size="13" fill="#D2DAE4">0xC6: chip reset (NXP), RELEASE</text>
<text x="926" y="377.9" font-size="13" fill="#D2DAE4">(GP)</text>

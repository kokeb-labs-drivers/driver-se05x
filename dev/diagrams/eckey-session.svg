<path d="M1053 210.8 L1053 874.8" fill="none" stroke="#8893A2" stroke-width="1.2" stroke-dasharray="4 5"/>
<path d="M153 266.8 L1047 266.8" fill="none" stroke="#9A4A17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<path d="M1047 324.8 L153 324.8" fill="none" stroke="#0B7A72" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-teal-strong)"/>
<path d="M153 440.8 L594 440.8" fill="none" stroke="#9A4A17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<path d="M153 498.8 L594 498.8" fill="none" stroke="#9A4A17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<path d="M153 556.8 L1047 556.8" fill="none" stroke="#9A4A17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<path d="M1047 614.8 L153 614.8" fill="none" stroke="#0B7A72" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-teal-strong)"/>
<path d="M153 672.8 L594 672.8" fill="none" stroke="#9A4A17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<path d="M153 846.8 L1047 846.8" fill="none" stroke="#9A4A17" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<rect x="32" y="137.8" width="230" height="69" rx="10" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="145.8" width="4" height="53" rx="2" fill="#9A4A17"/>
<rect x="485" y="137.8" width="230" height="69" rx="10" fill="#F3EEFF" stroke="#7C3AED" stroke-width="1.4"/>
<rect x="485" y="145.8" width="4" height="53" rx="2" fill="#7C3AED"/>
<rect x="938" y="137.8" width="230" height="69" rx="10" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="938" y="145.8" width="4" height="53" rx="2" fill="#0B7A72"/>
<rect x="32" y="358.8" width="408.4" height="59.8" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="32" y="706.8" width="408.4" height="59.8" rx="10" fill="#FFF5E3" stroke="#F1CF93" stroke-width="1"/>
<rect x="395.8" y="764.8" width="408.4" height="41" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<rect x="32" y="884.8" width="1136" height="60.5" rx="10" fill="#F1F4F8" stroke="#CBD5E1" stroke-width="1"/>
<text x="150" y="164.6" font-size="15" font-weight="700" text-anchor="middle" fill="#7A360E">eckey::Session</text>
<text x="150" y="189.4" font-size="13" text-anchor="middle" fill="#2B3442">the driver</text>
<text x="603" y="164.6" font-size="15" font-weight="700" text-anchor="middle" fill="#5B21B6">Crypto port</text>
<text x="603" y="189.4" font-size="13" text-anchor="middle" fill="#2B3442">ephemeral and host keys</text>
<text x="1056" y="164.6" font-size="15" font-weight="700" text-anchor="middle" fill="#0B5F59">SE05x IoT applet</text>
<text x="1056" y="189.4" font-size="13" text-anchor="middle" fill="#2B3442">ECKey auth object</text>
<rect x="460.6" y="240.8" width="278.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="255.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">attested ReadObject of the ECKA public key</text>
<rect x="526.9" y="298.8" width="146.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="313.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">public key, attestation</text>
<text x="46" y="383.9" font-size="13" fill="#8A3C0B">Verify the attestation before using the key (AN13030 p.</text>
<text x="46" y="402.7" font-size="13" fill="#8A3C0B">15).</text>
<rect x="218.6" y="414.8" width="309.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="373.5" y="429.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">GenerateP256(): ephemeral key, one per session</text>
<rect x="258.1" y="472.8" width="230.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="373.5" y="487.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">EcdsaP256Sign(): sign A6 and 7F49</text>
<rect x="506.2" y="530.8" width="187.7" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="545.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">84 88 00 00: A6, 7F49, 5F37</text>
<rect x="506.8" y="588.8" width="186.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="603.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">85: SE challenge, 86: receipt</text>
<rect x="188.4" y="646.8" width="370.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="373.5" y="661.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">EcdhP256(), SHA-256, AesCmac: master and session keys</text>
<text x="46" y="731.8" font-size="13" fill="#8A3C0B">Receipt = CMAC(S-RMAC, A6 and 7F49): compare in</text>
<text x="46" y="750.7" font-size="13" fill="#8A3C0B">constant time, else SecureChannelError.</text>
<text x="409.8" y="789.8" font-size="13" fill="#334155">Wipe the ephemeral private key and the master key.</text>
<rect x="441.8" y="820.8" width="316.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="835.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">wrapped APDU: counter from 1, IV = AES(counter)</text>
<text x="46" y="911.5" font-size="15" font-weight="700" fill="#334155">Receipt</text>
<text x="46" y="929.3" font-size="13" fill="#334155">Config::verify_eckey_receipt is on by default; the receipt is what proves the chip holds the session keys (AN13030 p. 5 and pp. 156-157).</text>
<rect x="32" y="960.7" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="54" y="972.3" font-size="12.5" fill="#566070">command</text>
<rect x="140.1" y="960.7" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="162.1" y="972.3" font-size="12.5" fill="#566070">reply</text>
<rect x="217.6" y="960.7" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="239.6" y="972.3" font-size="12.5" fill="#566070">check</text>
<rect x="301.6" y="960.7" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="323.6" y="972.3" font-size="12.5" fill="#566070">wipe</text>
</svg>

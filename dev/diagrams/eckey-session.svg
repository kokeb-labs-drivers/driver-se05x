<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1007" viewBox="0 0 1200 1007" role="img" aria-labelledby="eckey-session-title eckey-session-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="eckey-session-title">ECKey session: opening it</title>
<desc id="eckey-session-desc">Sequence diagram: attested read of the chip ECKA key, ephemeral key in the crypto port, ECKeySessionInternalAuthenticate, challenge and receipt, receipt check, session keys, wipe.</desc>
<defs><marker id="fk-arrow-brand-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9A4A17"/></marker><marker id="fk-arrow-teal-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A72"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="1006" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">SECURE CHANNEL</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">ECKey session: opening it</text>
<text x="32" y="103.8" font-size="15" fill="#566070">The host side of the key agreement lives in the crypto port.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>
<path d="M147 210.8 L147 874.8" fill="none" stroke="#8893A2" stroke-width="1.2" stroke-dasharray="4 5"/>

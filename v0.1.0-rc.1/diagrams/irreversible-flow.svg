<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="523" viewBox="0 0 1200 523" role="img" aria-labelledby="irreversible-flow-title irreversible-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="irreversible-flow-title">Irreversible operations: plan, confirm, apply</title>
<desc id="irreversible-flow-desc">Four steps: build flag, Plan (no I/O), Confirmation from the operation's phrase, Apply; and the list of the operations that need them.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8893A2"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="522" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">SAFETY</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Irreversible operations: plan, confirm, apply</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Nothing irreversible is one call away.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#E2E7EE"/>

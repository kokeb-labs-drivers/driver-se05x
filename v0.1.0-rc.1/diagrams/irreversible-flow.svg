<rect x="914" y="145.8" width="4" height="72" rx="2" fill="#DB2752"/>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#334155">1. Build flag</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">SE05X_ENABLE_IRREVERSIBLE</text>
<text x="52" y="208.2" font-size="13" fill="#2B3442">off by default</text>
<text x="346" y="164.6" font-size="15" font-weight="700" fill="#7A360E">2. Plan&lt;Op&gt;</text>
<text x="346" y="189.4" font-size="13" fill="#2B3442">Operations::Plan...()</text>
<text x="346" y="208.2" font-size="13" fill="#2B3442">checks, says what changes</text>
<text x="640" y="164.6" font-size="15" font-weight="700" fill="#7A360E">3. Confirmation&lt;Op&gt;</text>
<text x="640" y="189.4" font-size="13" fill="#2B3442">built from Op::kPhrase</text>
<text x="640" y="208.2" font-size="13" fill="#2B3442">a person reads the Plan</text>
<text x="934" y="164.6" font-size="15" font-weight="700" fill="#9F1239">4. Apply</text>
<text x="934" y="189.4" font-size="13" fill="#2B3442">Apply(plan, confirmation)</text>
<text x="934" y="208.2" font-size="13" fill="#2B3442">the only call that sends</text>
<text x="48" y="290.8" font-size="13" font-weight="700" fill="#9F1239">13 OPERATIONS</text>

<text x="600" y="509.8" font-size="22" font-weight="700" text-anchor="middle" fill="#E8EDF3">SE052</text>
<text x="600" y="535.8" font-size="14" text-anchor="middle" fill="#9AA6B5">top view</text>
<text x="158" y="294.6" font-size="15" font-weight="700" fill="#F5D0FE">1  LB</text>
<text x="158" y="393.8" font-size="15" font-weight="700" fill="#D6D3D1">2  n.c.</text>
<text x="158" y="492.9" font-size="15" font-weight="700" fill="#DDD6FE">3  IO1</text>
<text x="158" y="592.2" font-size="15" font-weight="700" fill="#D6D3D1">4  n.c.</text>
<text x="158" y="691.3" font-size="15" font-weight="700" fill="#D6D3D1">5  n.c.</text>
<text x="912" y="691.3" font-size="15" font-weight="700" fill="#BFDBFE">11  SDA</text>
<text x="912" y="716.2" font-size="13" fill="#D2DAE4">Write() / Read()</text>
<text x="912" y="592.2" font-size="15" font-weight="700" fill="#FECDD3">12  VIN</text>
<text x="912" y="492.9" font-size="15" font-weight="700" fill="#A7F3E6">13  CLK</text>
<text x="912" y="393.8" font-size="15" font-weight="700" fill="#A7F3E6">14  RST_N</text>
<text x="912" y="418.6" font-size="13" fill="#D2DAE4">Reset()</text>
<text x="912" y="294.6" font-size="15" font-weight="700" fill="#F1D5B5">15  VOUT</text>
<text x="352" y="834.5" font-size="15" font-weight="700" fill="#D6D3D1">6  n.c.</text>
<text x="461.2" y="834.5" font-size="15" font-weight="700" fill="#D6D3D1">7  n.c.</text>
<text x="570.4" y="834.5" font-size="15" font-weight="700" fill="#D6D3D1">8  n.c.</text>
<text x="679.6" y="834.5" font-size="15" font-weight="700" fill="#D6D3D1">9  n.c.</text>
<text x="788.8" y="834.5" font-size="15" font-weight="700" fill="#BFDBFE">10  SCL</text>
<text x="788.8" y="859.4" font-size="13" fill="#D2DAE4">Write() /</text>
<text x="788.8" y="878.2" font-size="13" fill="#D2DAE4">Read()</text>
<text x="788.8" y="180.6" font-size="15" font-weight="700" fill="#DDD6FE">16  IO2</text>
<text x="679.6" y="180.6" font-size="15" font-weight="700" fill="#F5D0FE">17  LA</text>
<text x="570.4" y="180.6" font-size="15" font-weight="700" fill="#FECDD3">18  VDD</text>
<text x="461.2" y="180.6" font-size="15" font-weight="700" fill="#E2E8F0">19  VSS</text>
<text x="352" y="180.6" font-size="15" font-weight="700" fill="#D6D3D1">20  n.c.</text>
<text x="46" y="960.5" font-size="15" font-weight="700" fill="#FDE68A">Different from the SE050 and SE051</text>
<text x="46" y="978.3" font-size="13" fill="#FDE68A">No ENA pin: deep power-down is the T=1 S-block 0xDF and the next I2C access wakes the chip, which boots with no state kept (section 10.3, p. 7). VOUT goes to VDD</text>
<text x="46" y="997.2" font-size="13" fill="#FDE68A">on the board (Table 2). RST_N low resets the chip (Table 2).</text>

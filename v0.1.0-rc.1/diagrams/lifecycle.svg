<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#7A360E">LIFECYCLE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#0E1726">Lifecycle settings and the roles that change them</text>
<text x="32" y="103.8" font-size="15" fill="#566070">Roles: None, User, Transport, PlatformScp, Feature, FactoryReset, Restrict</text>

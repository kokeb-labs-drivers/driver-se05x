<rect x="450" y="145.8" width="4" height="72" rx="2" fill="#C26A05"/>
<text x="470" y="364.6" font-size="15" font-weight="700" fill="#0B5F59">In use</text>
<text x="470" y="389.4" font-size="13" fill="#2B3442">objects per their policies</text>
<text x="470" y="408.3" font-size="13" fill="#2B3442">ReadState any time</text>
<text x="52" y="164.6" font-size="15" font-weight="700" fill="#334155">Transport locked</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">Transport role: SetLockState</text>
<text x="52" y="208.2" font-size="13" fill="#2B3442">only 5 commands answered</text>
<text x="888" y="164.6" font-size="15" font-weight="700" fill="#9F1239">Platform SCP required</text>
<text x="888" y="189.4" font-size="13" fill="#2B3442">PlatformScp role</text>
<text x="888" y="208.2" font-size="13" fill="#2B3442">full SCP03 from then on</text>
<text x="52" y="564.5" font-size="15" font-weight="700" fill="#9F1239">Creation restricted</text>
<text x="52" y="589.4" font-size="13" fill="#2B3442">DisableObjectCreation</text>
<text x="52" y="608.2" font-size="13" fill="#2B3442">persistent: cannot be undone</text>
<text x="888" y="564.5" font-size="15" font-weight="700" fill="#9F1239">Features changed</text>
<text x="888" y="589.4" font-size="13" fill="#2B3442">Feature role (ECKey)</text>
<text x="888" y="608.2" font-size="13" fill="#2B3442">SetAppletFeatures</text>
<text x="470" y="164.6" font-size="15" font-weight="700" fill="#8A3C0B">Factory reset</text>
<text x="470" y="189.4" font-size="13" fill="#2B3442">FactoryReset role: DeleteAll</text>
<text x="470" y="208.2" font-size="13" fill="#2B3442">provisioned objects stay</text>
<rect x="154.8" y="354.2" width="184.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="246.8" y="368.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">lock (transient or persistent)</text>
<rect x="108.8" y="393.8" width="146.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="182" y="408.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">unlock: Transport role</text>
<rect x="925.4" y="354.2" width="55.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="953.2" y="368.5" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">require</text>
<rect x="227.9" y="407" width="55.4" height="20" rx="10" fill="#FFFFFF"/>
<text x="255.6" y="421.3" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">restrict</text>
<rect x="902" y="407" width="84.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="944.4" y="421.3" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">set features</text>
<rect x="566.7" y="271.8" width="66.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="286.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">DeleteAll</text>
<rect x="32" y="641.2" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="652.8" font-size="12.5" fill="#566070">reversible</text>
<rect x="140.1" y="641.2" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="162.1" y="652.8" font-size="12.5" fill="#566070">irreversible: Plan and Confirmation</text>
<rect x="402.7" y="641.2" width="14" height="14" rx="4" fill="#FFF5E3" stroke="#C26A05" stroke-width="1.4"/>
<text x="424.7" y="652.8" font-size="12.5" fill="#566070">ends the session</text>

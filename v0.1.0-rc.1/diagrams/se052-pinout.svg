<text x="600" y="509.8" font-size="22" font-weight="700" text-anchor="middle" fill="#0E1726">SE052</text>
<text x="600" y="535.8" font-size="14" text-anchor="middle" fill="#566070">top view</text>
<text x="158" y="294.6" font-size="15" font-weight="700" fill="#86198F">1  LB</text>
<text x="158" y="393.8" font-size="15" font-weight="700" fill="#57534E">2  n.c.</text>
<text x="158" y="492.9" font-size="15" font-weight="700" fill="#5B21B6">3  IO1</text>
<text x="158" y="592.2" font-size="15" font-weight="700" fill="#57534E">4  n.c.</text>
<text x="158" y="691.3" font-size="15" font-weight="700" fill="#57534E">5  n.c.</text>
<text x="912" y="691.3" font-size="15" font-weight="700" fill="#1E429F">11  SDA</text>
<text x="912" y="716.2" font-size="13" fill="#2B3442">Write() / Read()</text>
<text x="912" y="592.2" font-size="15" font-weight="700" fill="#9F1239">12  VIN</text>
<text x="912" y="492.9" font-size="15" font-weight="700" fill="#0B5F59">13  CLK</text>
<text x="912" y="393.8" font-size="15" font-weight="700" fill="#0B5F59">14  RST_N</text>
<text x="912" y="418.6" font-size="13" fill="#2B3442">Reset()</text>
<text x="912" y="294.6" font-size="15" font-weight="700" fill="#6B3F17">15  VOUT</text>
<text x="352" y="834.5" font-size="15" font-weight="700" fill="#57534E">6  n.c.</text>
<text x="461.2" y="834.5" font-size="15" font-weight="700" fill="#57534E">7  n.c.</text>
<text x="570.4" y="834.5" font-size="15" font-weight="700" fill="#57534E">8  n.c.</text>
<text x="679.6" y="834.5" font-size="15" font-weight="700" fill="#57534E">9  n.c.</text>
<text x="788.8" y="834.5" font-size="15" font-weight="700" fill="#1E429F">10  SCL</text>
<text x="788.8" y="859.4" font-size="13" fill="#2B3442">Write() /</text>
<text x="788.8" y="878.2" font-size="13" fill="#2B3442">Read()</text>
<text x="788.8" y="180.6" font-size="15" font-weight="700" fill="#5B21B6">16  IO2</text>
<text x="679.6" y="180.6" font-size="15" font-weight="700" fill="#86198F">17  LA</text>
<text x="570.4" y="180.6" font-size="15" font-weight="700" fill="#9F1239">18  VDD</text>
<text x="461.2" y="180.6" font-size="15" font-weight="700" fill="#334155">19  VSS</text>
<text x="352" y="180.6" font-size="15" font-weight="700" fill="#57534E">20  n.c.</text>
<text x="46" y="960.5" font-size="15" font-weight="700" fill="#8A3C0B">Different from the SE050 and SE051</text>
<text x="46" y="978.3" font-size="13" fill="#8A3C0B">No ENA pin: deep power-down is the T=1 S-block 0xDF and the next I2C access wakes the chip, which boots with no state kept (section 10.3, p. 7). VOUT goes to VDD</text>
<text x="46" y="997.2" font-size="13" fill="#8A3C0B">on the board (Table 2). RST_N low resets the chip (Table 2).</text>

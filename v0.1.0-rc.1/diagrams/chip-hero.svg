<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="659" viewBox="0 0 1200 659" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">SE05x</title>
<desc id="chip-hero-desc">Overview of the SE05x, a family of secure elements (SE050, SE051, SE052) that hold keys and credentials isolated from the host, sign, agree keys and attest with them inside the chip, and talk to the host over I2C with T=1 framing and an encrypted SCP03 channel. A MCU talks to it over I2C, T=1; it drives Sensor or actuator. Headline figures: EAL 6+ Common Criteria, hardware and OS (SE051 2.2, p. 3; SE052 3.1, p. 3); 0x48 I2C target address, T=1 framing (SE052: Table 12, p. 18); 1.62 to 3.6 V VIN and VCC, SE050 and SE051; 3 x 3 mm HX2QFN20, SE050 and SE051; 4 x 4 mm HVQFN20, SE052.</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="996" height="475" viewBox="0 0 996 475" role="img" aria-labelledby="tls-sign-call-title tls-sign-call-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="tls-sign-call-title">A TLS client signature</title>
<desc id="tls-sign-call-desc">Mutual TLS: when the server requests a certificate, the TLS stack sends the client certificate read from the chip, has the chip sign the handshake digest through TlsSign and sends the signature as CertificateVerify.</desc>

<text x="110" y="665.5" font-size="15" font-weight="700" class="fk-f-ink">Your firmware</text>
<text x="436" y="665.5" font-size="15" font-weight="700" class="fk-f-amber-text">SE05x</text>
<text x="777" y="115.5" font-size="15" font-weight="700" class="fk-f-ink">Root of trust</text>
<text x="777" y="140.4" font-size="13" class="fk-f-ink2">a device identity key</text>
<text x="777" y="159.2" font-size="13" class="fk-f-ink2">that never leaves</text>
<text x="777" y="259.6" font-size="15" font-weight="700" class="fk-f-ink">Secret storage</text>
<text x="777" y="284.4" font-size="13" class="fk-f-ink2">Wi-Fi passphrase,</text>
<text x="777" y="303.2" font-size="13" class="fk-f-ink2">tokens, configuration</text>
<text x="762" y="403.6" font-size="15" font-weight="700" class="fk-f-ink">Certificates and signing</text>
<text x="762" y="428.4" font-size="13" class="fk-f-ink2">CSR, chain, ECDSA</text>
<text x="774" y="527.5" font-size="15" font-weight="700" class="fk-f-ink">TLS and mutual-auth</text>
<text x="774" y="552.4" font-size="13" class="fk-f-ink2">client credentials</text>
<text x="777" y="653.5" font-size="15" font-weight="700" class="fk-f-ink">Key agreement</text>
<text x="777" y="678.4" font-size="13" class="fk-f-ink2">ECDH with a peer</text>
<text x="777" y="777.5" font-size="15" font-weight="700" class="fk-f-ink">Secure sessions</text>
<text x="777" y="802.4" font-size="13" class="fk-f-ink2">an encrypted,</text>
<text x="777" y="821.2" font-size="13" class="fk-f-ink2">authenticated bus</text>
<text x="777" y="921.5" font-size="15" font-weight="700" class="fk-f-ink">Attestation</text>
<text x="777" y="946.4" font-size="13" class="fk-f-ink2">a signed answer,</text>
<text x="777" y="965.2" font-size="13" class="fk-f-ink2">checked on the host</text>
<text x="776" y="1065.5" font-size="15" font-weight="700" class="fk-f-ink">Monotonic counters</text>
<text x="776" y="1090.4" font-size="13" class="fk-f-ink2">anti-rollback floors</text>
<text x="776" y="1190.5" font-size="15" font-weight="700" class="fk-f-ink">Secure provisioning</text>
<text x="776" y="1215.4" font-size="13" class="fk-f-ink2">and lifecycle locks</text>
<rect x="292.5" y="714.3" width="111.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="348" y="728.6" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">I2C, T=1, SCP03</text>

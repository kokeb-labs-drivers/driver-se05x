<svg xmlns="http://www.w3.org/2000/svg" width="828" height="483" viewBox="0 0 828 483" role="img" aria-labelledby="sign-call-title sign-call-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="sign-call-title">Provision a signing key, then sign</title>
<desc id="sign-call-desc">Device identity: Provision creates a signing key pair inside the chip with no key bytes sent, and Sign sends a SHA-256 digest to the chip, which returns a DER signature checked by its response MAC.</desc>

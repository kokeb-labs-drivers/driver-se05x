<text x="52" y="164.6" font-size="15" font-weight="700" fill="#334155">Closed</text>
<text x="52" y="189.4" font-size="13" fill="#2B3442">before Open(), after Close()</text>
<text x="354" y="164.6" font-size="15" font-weight="700" fill="#0B5F59">Idle</text>
<text x="354" y="189.4" font-size="13" fill="#2B3442">open, nothing in flight</text>
<text x="656" y="164.6" font-size="15" font-weight="700" fill="#0B5F59">InFlight</text>
<text x="656" y="189.4" font-size="13" fill="#2B3442">one command exchanged</text>
<text x="656" y="354.6" font-size="15" font-weight="700" fill="#8A3C0B">NeedsReselect</text>
<text x="656" y="379.4" font-size="13" fill="#2B3442">chip context was reset</text>
<text x="656" y="544.5" font-size="15" font-weight="700" fill="#9F1239">Dead</text>
<text x="656" y="569.4" font-size="13" fill="#2B3442">ladder spent</text>
<rect x="270.9" y="162.3" width="54.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="298" y="176.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Open()</text>
<rect x="572.7" y="152" width="54.6" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="166.3" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">I-block</text>
<rect x="578.6" y="179.6" width="42.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="600" y="193.9" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">reply</text>

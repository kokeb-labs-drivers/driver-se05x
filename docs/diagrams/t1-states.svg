<text x="751" y="271.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">reset rung</text>
<rect x="419.7" y="352.3" width="90" height="20" rx="10" fill="#FFFFFF"/>
<text x="464.8" y="366.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">select applet</text>

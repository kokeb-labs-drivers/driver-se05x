<text x="174.5" y="613.8" font-size="12.5" fill="#566070">recovery</text>
<rect x="254.3" y="602.2" width="14" height="14" rx="4" fill="#FFEEF2" stroke="#DB2752" stroke-width="1.4"/>
<text x="276.3" y="613.8" font-size="12.5" fill="#566070">stopped</text>

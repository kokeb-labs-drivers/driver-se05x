<text x="573" y="441.5" font-size="16" font-weight="600" text-anchor="middle" fill="#D2DAE4">ENA  pin 11</text>
<text x="573" y="474.3" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" fill="#9AA6B5">SetEnable() / PowerCycle()</text>
<text x="50" y="575.3" font-size="20" font-weight="700" fill="#FECDD3">Supplies and ground</text>
<text x="50" y="598.8" font-size="17" fill="#FECDD3">+3V3: VIN; also U2.VDD · GND: RST_N, VSS, VSS_EP; also U2.GND</text>
<text x="50" y="668.3" font-size="20" font-weight="700" fill="#E2E8F0">Also on the board</text>
<text x="50" y="691.8" font-size="17" fill="#E2E8F0">Support parts: 1 capacitor, 2 resistors around the supplies (values in the full schematic). Not wired in this circuit (5): LA, LB, CLK,</text>
<text x="50" y="716.4" font-size="17" fill="#E2E8F0">IO1, IO2.</text>
<text x="32" y="762.4" font-size="16" fill="#9AA6B5">* Not confirmed in the datasheet: C1: a usual decoupling value; the SE050 data sheet gives none.</text>
<rect x="32" y="779.6" width="14" height="14" rx="4" fill="#13233A" stroke="#60A5FA" stroke-width="1.4"/>
<text x="54" y="794.2" font-size="16" fill="#9AA6B5">bus</text>

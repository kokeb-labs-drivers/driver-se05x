<text x="852.3" y="210.5" font-size="20" font-weight="700" text-anchor="middle" fill="#E8EDF3">SE05x</text>
<text x="852.3" y="232.9" font-size="16" text-anchor="middle" fill="#9AA6B5">U1</text>
<text x="245.7" y="210.5" font-size="20" font-weight="700" fill="#BFDBFE">MCU</text>
<text x="245.7" y="232.9" font-size="16" fill="#BFDBFE">U2</text>
<text x="409.7" y="286.1" font-size="16" font-weight="600" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="end" fill="#BFDBFE">I2C SDA</text>
<text x="754.3" y="286.1" font-size="16" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SDA</text>

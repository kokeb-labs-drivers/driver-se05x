<text x="116.9" y="119.3" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-green-text">Device::Open</text>
<text x="419" y="119.3" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-teal-text">Crypto port</text>
<text x="602.3" y="119.3" font-size="15" font-weight="700" text-anchor="middle" class="fk-f-amber-text">SE05x card manager</text>
<rect x="183.1" y="156.8" width="163.7" height="20" rx="10" class="fk-f-canvas"/>
<text x="265" y="171.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">host challenge (Random)</text>
<rect x="240.3" y="200.8" width="232.7" height="20" rx="10" class="fk-f-canvas"/>
<text x="356.6" y="215.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">INITIALIZE UPDATE (host challenge)</text>
<rect x="251.3" y="244.8" width="210.6" height="20" rx="10" class="fk-f-canvas"/>
<text x="356.6" y="259.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">card challenge, card cryptogram</text>
<rect x="121.9" y="288.8" width="286.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="265" y="303.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">derive S-ENC, S-MAC, S-RMAC (CMAC KDF)</text>
<text x="57.9" y="365.9" font-size="13" class="fk-f-amber-text">Device::Open: check the card cryptogram</text>
<rect x="191.1" y="384.8" width="331" height="20" rx="10" class="fk-f-canvas"/>
<text x="356.6" y="399.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">EXTERNAL AUTHENTICATE (host cryptogram, level)</text>
<text x="57.9" y="461.9" font-size="13" class="fk-f-amber-text">from here every command: C-MAC (+ C-DEC); every answer: R-MAC (+ R-ENC)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="654" height="560" viewBox="0 0 654 560" role="img" aria-labelledby="rollback-flow-title rollback-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="rollback-flow-title">The anti-rollback boot check</title>
<desc id="rollback-flow-desc">Flow of the boot check: the image version is compared with the floor, an older image is refused, and a newer one runs the self test and then raises the floor in one command.</desc>
<style>
.fk{--fk-amber-strong:#C26A05;--fk-amber-text:#8A3C0B;--fk-amber-tint:#FFF5E3;--fk-blue-strong:#2563EB;--fk-canvas:#FFFFFF;--fk-card:#FFFFFF;--fk-frame:#E2E7EE;--fk-green-strong:#15803D;--fk-hair:#E2E7EE;--fk-ink:#0E1726;--fk-ink2:#2B3442;--fk-line:#738093;--fk-muted:#566070;--fk-rail:#7C8798;--fk-rose-strong:#DB2752;}
@media (prefers-color-scheme:dark){.fk{--fk-amber-strong:#FBBF24;--fk-amber-text:#FDE68A;--fk-amber-tint:#2C2310;--fk-blue-strong:#60A5FA;--fk-canvas:#0E131A;--fk-card:#151C26;--fk-frame:#283241;--fk-green-strong:#4ADE80;--fk-hair:#252F3C;--fk-ink:#E8EDF3;--fk-ink2:#D2DAE4;--fk-line:#6C7889;--fk-muted:#9AA6B5;--fk-rail:#6C7889;--fk-rose-strong:#FB7185;}}
:root[data-theme="dark"] .fk,[data-md-color-scheme="slate"] .fk{--fk-amber-strong:#FBBF24;--fk-amber-text:#FDE68A;--fk-amber-tint:#2C2310;--fk-blue-strong:#60A5FA;--fk-canvas:#0E131A;--fk-card:#151C26;--fk-frame:#283241;--fk-green-strong:#4ADE80;--fk-hair:#252F3C;--fk-ink:#E8EDF3;--fk-ink2:#D2DAE4;--fk-line:#6C7889;--fk-muted:#9AA6B5;--fk-rail:#6C7889;--fk-rose-strong:#FB7185;}
:root[data-theme="light"] .fk,[data-md-color-scheme="default"] .fk{--fk-amber-strong:#C26A05;--fk-amber-text:#8A3C0B;--fk-amber-tint:#FFF5E3;--fk-blue-strong:#2563EB;--fk-canvas:#FFFFFF;--fk-card:#FFFFFF;--fk-frame:#E2E7EE;--fk-green-strong:#15803D;--fk-hair:#E2E7EE;--fk-ink:#0E1726;--fk-ink2:#2B3442;--fk-line:#738093;--fk-muted:#566070;--fk-rail:#7C8798;--fk-rose-strong:#DB2752;}
.fk-f-amber-strong{fill:var(--fk-amber-strong)}.fk-s-amber-strong{stroke:var(--fk-amber-strong)}
.fk-f-amber-text{fill:var(--fk-amber-text)}.fk-s-amber-text{stroke:var(--fk-amber-text)}
.fk-f-amber-tint{fill:var(--fk-amber-tint)}.fk-s-amber-tint{stroke:var(--fk-amber-tint)}
.fk-f-blue-strong{fill:var(--fk-blue-strong)}.fk-s-blue-strong{stroke:var(--fk-blue-strong)}
.fk-f-canvas{fill:var(--fk-canvas)}.fk-s-canvas{stroke:var(--fk-canvas)}
.fk-f-card{fill:var(--fk-card)}.fk-s-card{stroke:var(--fk-card)}
.fk-f-frame{fill:var(--fk-frame)}.fk-s-frame{stroke:var(--fk-frame)}
.fk-f-green-strong{fill:var(--fk-green-strong)}.fk-s-green-strong{stroke:var(--fk-green-strong)}
.fk-f-hair{fill:var(--fk-hair)}.fk-s-hair{stroke:var(--fk-hair)}
.fk-f-ink{fill:var(--fk-ink)}.fk-s-ink{stroke:var(--fk-ink)}
.fk-f-ink2{fill:var(--fk-ink2)}.fk-s-ink2{stroke:var(--fk-ink2)}
.fk-f-line{fill:var(--fk-line)}.fk-s-line{stroke:var(--fk-line)}
.fk-f-muted{fill:var(--fk-muted)}.fk-s-muted{stroke:var(--fk-muted)}
.fk-f-rail{fill:var(--fk-rail)}.fk-s-rail{stroke:var(--fk-rail)}
.fk-f-rose-strong{fill:var(--fk-rose-strong)}.fk-s-rose-strong{stroke:var(--fk-rose-strong)}
@media (forced-colors:active){.fk text{fill:CanvasText}.fk rect,.fk circle{fill:Canvas;stroke:CanvasText}.fk path{stroke:CanvasText}.fk marker path{fill:CanvasText;stroke:none}}
</style>
<defs><marker id="rollback-flow-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="fk-f-rail"/></marker></defs>
<rect x="0.5" y="0.5" width="653" height="559" rx="16" class="fk-f-canvas fk-s-frame"/>
<text x="32" y="54.8" font-size="26" font-weight="700" class="fk-f-ink">The anti-rollback boot check</text>
<rect x="32" y="70.8" width="590" height="1" class="fk-f-hair"/>
<path d="M274.5 136.8 L274.5 172.3 Q274.5 172.8 275 172.8 L275 172.8 Q275.5 172.8 275.5 173.3 L275.5 208.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rollback-flow-arrow-rail)" class="fk-s-rail"/>
<path d="M194 260.8 L194 271.8 Q194 279.8 202 279.8 L222.2 279.8 Q230.2 279.8 230.2 287.8 L230.2 383.3 Q230.2 391.3 222.2 391.3 L112 391.3 Q104 391.3 104 399.3 L104 456.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#rollback-flow-arrow-rail)" class="fk-s-rail"/>
<path d="M357 260.8 L357 309.8 Q357 313.8 361 313.8 L361 313.8 Q365 313.8 365 317.8 L365 332.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rollback-flow-arrow-rail)" class="fk-s-rail"/>
<path d="M446 384.8 L446 438.8 Q446 440.8 448 440.8 L448 440.8 Q450 440.8 450 442.8 L450 456.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rollback-flow-arrow-rail)" class="fk-s-rail"/>
<path d="M284 384.8 L284 403.3 Q284 411.3 276 411.3 L274 411.3 Q266 411.3 266 419.3 L266 456.8" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#rollback-flow-arrow-rail)" class="fk-s-rail"/>
<rect x="176" y="88.8" width="197" height="44" rx="10" stroke-width="1" class="fk-f-card fk-s-line"/>
<rect x="176" y="96.8" width="4" height="28" rx="2" class="fk-f-blue-strong"/>
<rect x="180" y="212.8" width="191" height="44" rx="10" stroke-width="1.4" class="fk-f-amber-tint fk-s-amber-strong"/>
<rect x="180" y="220.8" width="4" height="28" rx="2" class="fk-f-amber-strong"/>
<rect x="90" y="460.8" width="190" height="69" rx="10" stroke-width="1" class="fk-f-card fk-s-line"/>
<rect x="90" y="468.8" width="4" height="53" rx="2" class="fk-f-rose-strong"/>
<rect x="270" y="336.8" width="190" height="44" rx="10" stroke-width="1" class="fk-f-card fk-s-line"/>
<rect x="270" y="344.8" width="4" height="28" rx="2" class="fk-f-blue-strong"/>
<rect x="336" y="460.8" width="228" height="69" rx="10" stroke-width="1" class="fk-f-card fk-s-line"/>
<rect x="336" y="468.8" width="4" height="53" rx="2" class="fk-f-green-strong"/>
<text x="196" y="115.5" font-size="15" font-weight="700" class="fk-f-ink">Boot image version v</text>
<text x="200" y="239.6" font-size="15" font-weight="700" class="fk-f-amber-text">CheckFloor(floor, v)</text>
<text x="110" y="487.6" font-size="15" font-weight="700" class="fk-f-ink">Refuse the image</text>
<text x="110" y="512.4" font-size="13" class="fk-f-ink2">boot the fallback</text>
<text x="290" y="363.6" font-size="15" font-weight="700" class="fk-f-ink">Run the self test</text>
<text x="356" y="487.6" font-size="15" font-weight="700" class="fk-f-ink">RaiseCounterTo(floor, v)</text>
<text x="356" y="512.4" font-size="13" class="fk-f-ink2">one command</text>
<rect x="238.2" y="269.8" width="201" height="20" rx="10" class="fk-f-canvas"/>
<text x="338.8" y="284.2" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">v below the floor: PolicyDenied</text>
<rect x="373.1" y="303.8" width="28.9" height="20" rx="10" class="fk-f-canvas"/>
<text x="387.5" y="318.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">Ok</text>
<rect x="457.9" y="430.8" width="56.1" height="20" rx="10" class="fk-f-canvas"/>
<text x="486" y="445.1" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">passed</text>
<rect x="292.1" y="401.3" width="45.8" height="20" rx="10" class="fk-f-canvas"/>
<text x="315" y="415.6" font-size="12" font-weight="500" text-anchor="middle" class="fk-f-muted">failed</text>
</svg>

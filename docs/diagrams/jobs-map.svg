<svg xmlns="http://www.w3.org/2000/svg" width="1052" height="1263" viewBox="0 0 1052 1263" role="img" aria-labelledby="jobs-map-title jobs-map-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="jobs-map-title">What the chip does for your firmware</title>
<desc id="jobs-map-desc">Map of the jobs of the SE05x: your firmware talks to the chip over I2C with T=1 and SCP03, and the chip provides a root of trust, secret storage, certificates, TLS credentials, key agreement, secure sessions, attestation, counters and provisioning.</desc>

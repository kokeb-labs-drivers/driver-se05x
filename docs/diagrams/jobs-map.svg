<text x="110" y="665.5" font-size="15" font-weight="700" fill="#0E1726">Your firmware</text>
<text x="436" y="665.5" font-size="15" font-weight="700" fill="#8A3C0B">SE05x</text>
<text x="777" y="115.5" font-size="15" font-weight="700" fill="#0E1726">Root of trust</text>
<text x="777" y="140.4" font-size="13" fill="#2B3442">a device identity key</text>
<text x="777" y="159.2" font-size="13" fill="#2B3442">that never leaves</text>
<text x="777" y="259.6" font-size="15" font-weight="700" fill="#0E1726">Secret storage</text>
<text x="777" y="284.4" font-size="13" fill="#2B3442">Wi-Fi passphrase,</text>
<text x="777" y="303.2" font-size="13" fill="#2B3442">tokens, configuration</text>
<text x="762" y="403.6" font-size="15" font-weight="700" fill="#0E1726">Certificates and signing</text>
<text x="762" y="428.4" font-size="13" fill="#2B3442">CSR, chain, ECDSA</text>
<text x="774" y="527.5" font-size="15" font-weight="700" fill="#0E1726">TLS and mutual-auth</text>
<text x="774" y="552.4" font-size="13" fill="#2B3442">client credentials</text>
<text x="777" y="653.5" font-size="15" font-weight="700" fill="#0E1726">Key agreement</text>
<text x="777" y="678.4" font-size="13" fill="#2B3442">ECDH with a peer</text>
<text x="777" y="777.5" font-size="15" font-weight="700" fill="#0E1726">Secure sessions</text>
<text x="777" y="802.4" font-size="13" fill="#2B3442">an encrypted,</text>
<text x="777" y="821.2" font-size="13" fill="#2B3442">authenticated bus</text>
<text x="777" y="921.5" font-size="15" font-weight="700" fill="#0E1726">Attestation</text>
<text x="777" y="946.4" font-size="13" fill="#2B3442">a signed answer,</text>
<text x="777" y="965.2" font-size="13" fill="#2B3442">checked on the host</text>
<text x="776" y="1065.5" font-size="15" font-weight="700" fill="#0E1726">Monotonic counters</text>
<text x="776" y="1090.4" font-size="13" fill="#2B3442">anti-rollback floors</text>
<text x="776" y="1190.5" font-size="15" font-weight="700" fill="#0E1726">Secure provisioning</text>
<text x="776" y="1215.4" font-size="13" fill="#2B3442">and lifecycle locks</text>
<rect x="292.5" y="714.3" width="111.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="348" y="728.6" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">I2C, T=1, SCP03</text>

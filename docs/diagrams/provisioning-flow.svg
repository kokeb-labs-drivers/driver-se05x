<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1168" viewBox="0 0 640 1168" role="img" aria-labelledby="provisioning-flow-title provisioning-flow-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="provisioning-flow-title">The factory provisioning flow</title>
<desc id="provisioning-flow-desc">Flow of factory provisioning: open with the product's platform keys, provision keys, record the identity, install certificates, create counters and store credentials, then either lock the device or ship it unlocked for development.</desc>

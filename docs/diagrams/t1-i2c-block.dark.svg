<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1086" viewBox="0 0 640 1086" role="img" aria-labelledby="t1-i2c-block-title t1-i2c-block-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="t1-i2c-block-title">One T=1 block each way on I2C</title>
<desc id="t1-i2c-block-desc">Two I2C transfers of the NXP T=1 flavour: the host writes a block with NAD, PCB, LEN, the information field and a two-byte CRC, and after polling reads the chip's block of the same form.</desc>
<rect x="0.5" y="0.5" width="639" height="1085" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44.4" font-size="13" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="76.2" font-size="24" font-weight="700" fill="#E8EDF3">One T=1 block each way on I2C</text>
<text x="32" y="102.7" font-size="15" fill="#9AA6B5">Datasheet: UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5;</text>
<text x="32" y="124.5" font-size="15" fill="#9AA6B5">UM11225 3.1.1.4 SE I2C Default Values, Table 14, p. 19; UM11225 2.1.2</text>
<text x="32" y="146.2" font-size="15" fill="#9AA6B5">Information Field (INF), Table 10, p. 8; UM11225 2.1.3 Epilogue Field (CRC),</text>
<text x="32" y="167.9" font-size="15" fill="#9AA6B5">p. 9; UM11225 3.1.1.1 SE I2C Receive State, Figure 4, p. 13; UM11225 3.1.1.2</text>
<text x="32" y="189.7" font-size="15" fill="#9AA6B5">SE I2C Processing State, p. 14; UM11225 3.1.1.3 SE I2C Send State, Figures 7</text>
<text x="32" y="211.4" font-size="15" fill="#9AA6B5">and 8, p. 15.</text>

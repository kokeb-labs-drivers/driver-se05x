<rect x="32" y="903.5" width="576" height="152.1" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="32" y="272.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">Host to SE</text>
<text x="187.5" y="272.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Adr + W</text>
<text x="264.2" y="272.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">NAD</text>
<text x="325.6" y="272.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">PCB</text>
<text x="387.1" y="272.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">LEN</text>
<text x="448.5" y="272.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">INF</text>
<text x="509.9" y="272.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">CRC-1</text>
<text x="571.3" y="272.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">CRC-2</text>
<text x="32" y="320.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">SE to Host</text>
<text x="187.5" y="320.5" font-size="14" font-weight="600" text-anchor="middle" fill="#BFDBFE">Adr + R</text>
<text x="264.2" y="320.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">NAD</text>
<text x="325.6" y="320.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">PCB</text>
<text x="387.1" y="320.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">LEN</text>
<text x="448.5" y="320.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">INF</text>
<text x="509.9" y="320.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC-1</text>
<text x="571.3" y="320.5" font-size="14" font-weight="600" text-anchor="middle" fill="#A7F3E6">CRC-2</text>
<text x="32" y="363.9" font-size="17" font-weight="700" fill="#E8EDF3">Values</text>
<text x="32" y="400.3" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">NAD</text>
<text x="608" y="400.3" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 1 byte</text>
<text x="32" y="420.5" font-size="15" fill="#D2DAE4">Node address: 0x5A host to SE, 0xA5 SE to host</text>
<text x="32" y="440.7" font-size="14" fill="#9AA6B5">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="473.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">PCB</text>
<text x="608" y="473.1" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 1 byte</text>
<text x="32" y="493.4" font-size="15" fill="#D2DAE4">Protocol control: I-, R- or S-block</text>
<text x="32" y="513.5" font-size="14" fill="#9AA6B5">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="546" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">LEN</text>
<text x="608" y="546" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 1 byte</text>
<text x="32" y="566.2" font-size="15" fill="#D2DAE4">Length of INF</text>
<text x="32" y="586.4" font-size="14" fill="#9AA6B5">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="618.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">INF</text>
<text x="608" y="618.9" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">min 0 · max 254 byte</text>
<text x="32" y="639.1" font-size="15" fill="#D2DAE4">Information field</text>
<text x="32" y="659.2" font-size="14" fill="#9AA6B5">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="691.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">CRC16</text>
<text x="608" y="691.7" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 2 byte</text>
<text x="32" y="712" font-size="15" fill="#D2DAE4">Error detection code of the block</text>
<text x="32" y="732.1" font-size="14" fill="#9AA6B5">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="764.6" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">DSEGT</text>
<text x="608" y="764.6" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 10 µs</text>
<text x="32" y="784.8" font-size="15" fill="#D2DAE4">Default guard time between two I2C accesses</text>
<text x="32" y="805" font-size="14" fill="#9AA6B5">Datasheet UM11225 3.1.1.4 SE I2C Default Values, Table 14, p. 19</text>
<text x="32" y="837.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#E8EDF3">DMPOT</text>
<text x="608" y="837.4" font-size="15" font-weight="700" text-anchor="end" fill="#E8EDF3">typ 1 ms</text>
<text x="32" y="857.7" font-size="15" fill="#D2DAE4">Default minimum polling time</text>
<text x="32" y="877.8" font-size="14" fill="#9AA6B5">Datasheet UM11225 3.1.1.4 SE I2C Default Values, Table 14, p. 19</text>
<text x="46" y="932" font-size="17" font-weight="700" fill="#E2E8F0">Notes</text>
<text x="46" y="952.4" font-size="15" fill="#E2E8F0">In an I-block INF holds the command or response APDU; an R-block has</text>
<text x="46" y="974.1" font-size="15" fill="#E2E8F0">none. The CRC covers the prologue and INF. A whole block in one I2C</text>
<text x="46" y="995.9" font-size="15" fill="#E2E8F0">write, START to STOP, never a repeated START. While it works the SE</text>
<text x="46" y="1017.6" font-size="15" fill="#E2E8F0">NACKs its address; the host polls with one-byte reads, MPOT apart. The</text>
<text x="46" y="1039.4" font-size="15" fill="#E2E8F0">host may read the prologue first and the rest in a second read.</text>
</svg>

<text x="418.2" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#14532D">hrot::Device</text>
<text x="767.2" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#8A3C0B">SE05x</text>
<text x="48.8" y="189.8" font-size="13" fill="#8A3C0B">provisioning, once</text>
<rect x="155.1" y="208.8" width="209.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="260" y="223.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Store(slot 1, passphrase, Secret)</text>

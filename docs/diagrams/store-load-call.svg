<text x="589.7" y="267.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">CheckObjectExists, WriteBinary (encrypted, MACed)</text>
<rect x="511.2" y="296.8" width="157.1" height="20" rx="10" fill="#FFFFFF"/>
<text x="589.7" y="311.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">9000 (R-MAC checked)</text>
<text x="48.8" y="373.9" font-size="13" fill="#8A3C0B">every boot</text>
<rect x="173.1" y="392.8" width="173.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="260" y="407.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">Load(slot 1, buffer, Secret)</text>
<rect x="478.8" y="436.8" width="221.8" height="20" rx="10" fill="#FFFFFF"/>
<text x="589.7" y="451.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">ReadSize, ReadObject (encrypted)</text>
<rect x="503" y="480.8" width="173.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="589.7" y="495.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">the bytes (R-ENC, R-MAC)</text>
<rect x="112.8" y="524.8" width="294.5" height="20" rx="10" fill="#FFFFFF"/>
<text x="260" y="539.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">SecretBuffer, wiped when it goes out of scope</text>
</svg>

<path d="M597.3 312.8 L933.4 312.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#agree-call-arrow-rail)"/>
<path d="M933.4 356.8 L597.3 356.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#agree-call-arrow-rail)"/>

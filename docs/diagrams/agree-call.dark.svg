<svg xmlns="http://www.w3.org/2000/svg" width="1042" height="500" viewBox="0 0 1042 500" role="img" aria-labelledby="agree-call-title agree-call-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="agree-call-title">ECDH key agreement</title>
<desc id="agree-call-desc">ECDH key agreement: the firmware provisions an agreement key once, receives the peer's public key, and Agree has the chip compute the shared secret under encryption both ways and return it in a SecretBuffer that wipes itself.</desc>

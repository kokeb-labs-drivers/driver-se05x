<text x="277.6" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#F5D0FE">Firmware</text>
<text x="596.3" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#BBF7D0">hrot::Device</text>
<text x="940.4" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#FDE68A">SE05x</text>
<rect x="303.8" y="156.8" width="260.4" height="20" rx="10" fill="#0E131A"/>
<text x="434" y="171.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Provision&lt;KeyUse::Agree&gt;(slot 1) (once)</text>

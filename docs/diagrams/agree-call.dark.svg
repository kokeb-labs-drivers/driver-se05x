<text x="434" y="259.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">Agree(key, peer, SecretBuffer)</text>
<rect x="601.3" y="288.8" width="328" height="20" rx="10" fill="#0E131A"/>
<text x="765.3" y="303.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">ECDHGenerateSharedSecret (encrypted both ways)</text>
<rect x="665" y="332.8" width="200.6" height="20" rx="10" fill="#0E131A"/>
<text x="765.3" y="347.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">shared secret (R-ENC, R-MAC)</text>
<rect x="282.6" y="376.8" width="302.7" height="20" rx="10" fill="#0E131A"/>
<text x="434" y="391.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">SecretBuffer, wiped on failure and at scope end</text>
<text x="218.6" y="453.9" font-size="13" fill="#FDE68A">HKDF, then AES-GCM with the derived key</text>
</svg>

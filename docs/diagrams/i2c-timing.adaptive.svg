<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1240" viewBox="0 0 640 1240" role="img" aria-labelledby="i2c-timing-title i2c-timing-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="i2c-timing-title">I2C timing of the address byte</title>
<desc id="i2c-timing-desc">I2C timing of the SE05x: the start condition and the address 0x48 with the write bit, bit by bit, with the two data hold times the data sheet defines after a falling SCL edge, the edge times and the clock limits.</desc>

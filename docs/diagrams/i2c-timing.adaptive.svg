<text x="32" y="326" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">SDA</text>
<text x="194.7" y="373.8" font-size="14" font-weight="700" class="fk-f-ink">tHDr;DAT50</text>
<text x="237.5" y="408" font-size="14" font-weight="700" class="fk-f-ink">tHDf;DAT50</text>
<text x="32" y="437.4" font-size="17" font-weight="700" class="fk-f-ink">Timing values</text>
<text x="32" y="473.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tHDr;DAT50</text>
<text x="608" y="473.9" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 24 ns</text>
<text x="32" y="494.1" font-size="15" class="fk-f-ink2">Data hold, 50 % SCL fall to 50 % SDA rise, Fast mode</text>
<text x="32" y="514.2" font-size="14" class="fk-f-muted">Datasheet SE050 14.3 I2C Bus Timings, Figure 11, Table 17, p. 21</text>
<text x="32" y="546.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tHDf;DAT50</text>
<text x="608" y="546.7" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 8 ns</text>
<text x="32" y="567" font-size="15" class="fk-f-ink2">Data hold, 50 % SCL fall to 50 % SDA fall, Fast mode</text>
<text x="32" y="587.1" font-size="14" class="fk-f-muted">Datasheet SE050 14.3 I2C Bus Timings, Figure 11, Table 17, p. 21</text>
<text x="32" y="619.6" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tHDr;DAT50</text>
<text x="608" y="619.6" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 9 ns</text>
<text x="32" y="639.8" font-size="15" class="fk-f-ink2">Data hold before a rising SDA edge, Hs mode</text>
<text x="32" y="660" font-size="14" class="fk-f-muted">Datasheet SE050 14.3 I2C Bus Timings, Figure 11, Table 17, p. 21</text>
<text x="32" y="692.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tHDf;DAT50</text>
<text x="608" y="692.4" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 8 ns</text>
<text x="32" y="712.7" font-size="15" class="fk-f-ink2">Data hold before a falling SDA edge, Hs mode</text>
<text x="32" y="732.8" font-size="14" class="fk-f-muted">Datasheet SE050 14.3 I2C Bus Timings, Figure 11, Table 17, p. 21</text>
<text x="32" y="765.2" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tr(i)</text>
<text x="608" y="765.2" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 1 µs</text>
<text x="32" y="785.5" font-size="15" class="fk-f-ink2">Input rise time, 30 % to 70 %</text>
<text x="32" y="805.7" font-size="14" class="fk-f-muted">Datasheet SE050 14.2 AC characteristics, Table 14, p. 18</text>
<text x="32" y="838.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tf(i)</text>
<text x="608" y="838.1" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 1 µs</text>
<text x="32" y="858.4" font-size="15" class="fk-f-ink2">Input fall time, 70 % to 30 %</text>
<text x="32" y="878.5" font-size="14" class="fk-f-muted">Datasheet SE050 14.2 AC characteristics, Table 14, p. 18</text>
<text x="32" y="911" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">tf(o)</text>
<text x="608" y="911" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 0.3 µs</text>
<text x="32" y="931.2" font-size="15" class="fk-f-ink2">Output fall time, CL = 30 pF</text>
<text x="32" y="951.4" font-size="14" class="fk-f-muted">Datasheet SE050 14.2 AC characteristics, Table 14, p. 18</text>
<text x="32" y="983.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">fSCL</text>
<text x="608" y="983.8" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 3.4 MHz</text>
<text x="32" y="1004.1" font-size="15" class="fk-f-ink2">SCL clock with clock stretching enabled (Hs mode)</text>
<text x="32" y="1024.2" font-size="14" class="fk-f-muted">Datasheet SE050 4.1.1 Supported I2C frequencies, p. 9</text>
<text x="32" y="1056.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">fSCL</text>
<text x="608" y="1056.7" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">max 1 MHz</text>
<text x="32" y="1076.9" font-size="15" class="fk-f-ink2">SCL clock with clock stretching disabled</text>
<text x="32" y="1097.1" font-size="14" class="fk-f-muted">Datasheet SE050 4.1.1 Supported I2C frequencies, p. 9</text>
<text x="46" y="1151.2" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="1171.6" font-size="15" class="fk-f-slate-text">The A, B, C, D and F configurations stretch the clock above 600 kHz; the</text>
<text x="46" y="1193.4" font-size="15" class="fk-f-slate-text">SE050E has it off by default.</text>

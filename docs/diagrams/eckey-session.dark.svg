<path d="M1047 614.8 L153 614.8" fill="none" stroke="#2BB3A3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#fk-arrow-teal-strong)"/>
<path d="M153 672.8 L594 672.8" fill="none" stroke="#F4B942" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<path d="M153 846.8 L1047 846.8" fill="none" stroke="#F4B942" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-brand-strong)"/>
<rect x="32" y="137.8" width="230" height="69" rx="10" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<rect x="32" y="145.8" width="4" height="53" rx="2" fill="#F4B942"/>
<rect x="485" y="137.8" width="230" height="69" rx="10" fill="#221A3A" stroke="#A78BFA" stroke-width="1.4"/>
<rect x="485" y="145.8" width="4" height="53" rx="2" fill="#A78BFA"/>
<rect x="938" y="137.8" width="230" height="69" rx="10" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<rect x="938" y="145.8" width="4" height="53" rx="2" fill="#2BB3A3"/>
<rect x="32" y="358.8" width="408.4" height="59.8" rx="10" fill="#2C2310" stroke="#6A5220" stroke-width="1"/>
<rect x="32" y="706.8" width="408.4" height="59.8" rx="10" fill="#2C2310" stroke="#6A5220" stroke-width="1"/>
<rect x="395.8" y="764.8" width="408.4" height="41" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<rect x="32" y="884.8" width="1136" height="60.5" rx="10" fill="#1B232E" stroke="#3A4656" stroke-width="1"/>
<text x="150" y="164.6" font-size="15" font-weight="700" text-anchor="middle" fill="#F8D27A">eckey::Session</text>
<text x="150" y="189.4" font-size="13" text-anchor="middle" fill="#D2DAE4">the driver</text>
<text x="603" y="164.6" font-size="15" font-weight="700" text-anchor="middle" fill="#DDD6FE">Crypto port</text>
<text x="603" y="189.4" font-size="13" text-anchor="middle" fill="#D2DAE4">ephemeral and host keys</text>
<text x="1056" y="164.6" font-size="15" font-weight="700" text-anchor="middle" fill="#A7F3E6">SE05x IoT applet</text>
<text x="1056" y="189.4" font-size="13" text-anchor="middle" fill="#D2DAE4">ECKey auth object</text>
<rect x="460.6" y="240.8" width="278.7" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="255.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">attested ReadObject of the ECKA public key</text>
<rect x="526.9" y="298.8" width="146.3" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="313.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">public key, attestation</text>
<text x="46" y="383.9" font-size="13" fill="#FDE68A">Verify the attestation before using the key (AN13030 p.</text>
<text x="46" y="402.7" font-size="13" fill="#FDE68A">15).</text>
<rect x="218.6" y="414.8" width="309.9" height="20" rx="10" fill="#0E131A"/>
<text x="373.5" y="429.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">GenerateP256(): ephemeral key, one per session</text>
<rect x="258.1" y="472.8" width="230.9" height="20" rx="10" fill="#0E131A"/>
<text x="373.5" y="487.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">EcdsaP256Sign(): sign A6 and 7F49</text>
<rect x="506.2" y="530.8" width="187.7" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="545.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">84 88 00 00: A6, 7F49, 5F37</text>
<rect x="506.8" y="588.8" width="186.4" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="603.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">85: SE challenge, 86: receipt</text>
<rect x="188.4" y="646.8" width="370.3" height="20" rx="10" fill="#0E131A"/>
<text x="373.5" y="661.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">EcdhP256(), SHA-256, AesCmac: master and session keys</text>
<text x="46" y="731.8" font-size="13" fill="#FDE68A">Receipt = CMAC(S-RMAC, A6 and 7F49): compare in</text>
<text x="46" y="750.7" font-size="13" fill="#FDE68A">constant time, else SecureChannelError.</text>
<text x="409.8" y="789.8" font-size="13" fill="#E2E8F0">Wipe the ephemeral private key and the master key.</text>
<rect x="441.8" y="820.8" width="316.3" height="20" rx="10" fill="#0E131A"/>
<text x="600" y="835.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">wrapped APDU: counter from 1, IV = AES(counter)</text>
<text x="46" y="911.5" font-size="15" font-weight="700" fill="#E2E8F0">Receipt</text>
<text x="46" y="929.3" font-size="13" fill="#E2E8F0">Config::verify_eckey_receipt is on by default; the receipt is what proves the chip holds the session keys (AN13030 p. 5 and pp. 156-157).</text>
<rect x="32" y="960.7" width="14" height="14" rx="4" fill="#2A2113" stroke="#F4B942" stroke-width="1.4"/>
<text x="54" y="972.3" font-size="12.5" fill="#9AA6B5">command</text>
<rect x="140.1" y="960.7" width="14" height="14" rx="4" fill="#0F2A28" stroke="#2BB3A3" stroke-width="1.4"/>
<text x="162.1" y="972.3" font-size="12.5" fill="#9AA6B5">reply</text>
<rect x="217.6" y="960.7" width="14" height="14" rx="4" fill="#2C2310" stroke="#FBBF24" stroke-width="1.4"/>
<text x="239.6" y="972.3" font-size="12.5" fill="#9AA6B5">check</text>
<rect x="301.6" y="960.7" width="14" height="14" rx="4" fill="#1B232E" stroke="#94A3B8" stroke-width="1.4"/>
<text x="323.6" y="972.3" font-size="12.5" fill="#9AA6B5">wipe</text>
</svg>

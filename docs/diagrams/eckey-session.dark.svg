<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">SECURE CHANNEL</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">ECKey session: opening it</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The host side of the key agreement lives in the crypto port.</text>
<rect x="32" y="119.8" width="1136" height="1" fill="#252F3C"/>
<path d="M147 210.8 L147 874.8" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="4 5"/>

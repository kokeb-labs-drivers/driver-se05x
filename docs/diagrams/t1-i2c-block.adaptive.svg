<text x="32" y="272.8" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">Host to SE</text>
<text x="187.5" y="272.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Adr + W</text>
<text x="264.2" y="272.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">NAD</text>
<text x="325.6" y="272.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">PCB</text>
<text x="387.1" y="272.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">LEN</text>
<text x="448.5" y="272.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">INF</text>
<text x="509.9" y="272.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">CRC-1</text>
<text x="571.3" y="272.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">CRC-2</text>
<text x="32" y="320.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">SE to Host</text>
<text x="187.5" y="320.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-blue-text">Adr + R</text>
<text x="264.2" y="320.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">NAD</text>
<text x="325.6" y="320.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">PCB</text>
<text x="387.1" y="320.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">LEN</text>
<text x="448.5" y="320.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">INF</text>
<text x="509.9" y="320.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">CRC-1</text>
<text x="571.3" y="320.5" font-size="14" font-weight="600" text-anchor="middle" class="fk-f-teal-text">CRC-2</text>
<text x="32" y="363.9" font-size="17" font-weight="700" class="fk-f-ink">Values</text>
<text x="32" y="400.3" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">NAD</text>
<text x="608" y="400.3" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 1 byte</text>
<text x="32" y="420.5" font-size="15" class="fk-f-ink2">Node address: 0x5A host to SE, 0xA5 SE to host</text>
<text x="32" y="440.7" font-size="14" class="fk-f-muted">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="473.1" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">PCB</text>
<text x="608" y="473.1" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 1 byte</text>
<text x="32" y="493.4" font-size="15" class="fk-f-ink2">Protocol control: I-, R- or S-block</text>
<text x="32" y="513.5" font-size="14" class="fk-f-muted">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="546" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">LEN</text>
<text x="608" y="546" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 1 byte</text>
<text x="32" y="566.2" font-size="15" class="fk-f-ink2">Length of INF</text>
<text x="32" y="586.4" font-size="14" class="fk-f-muted">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="618.9" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">INF</text>
<text x="608" y="618.9" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">min 0 · max 254 byte</text>
<text x="32" y="639.1" font-size="15" class="fk-f-ink2">Information field</text>
<text x="32" y="659.2" font-size="14" class="fk-f-muted">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="691.7" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">CRC16</text>
<text x="608" y="691.7" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 2 byte</text>
<text x="32" y="712" font-size="15" class="fk-f-ink2">Error detection code of the block</text>
<text x="32" y="732.1" font-size="14" class="fk-f-muted">Datasheet UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4, p. 5</text>
<text x="32" y="764.6" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">DSEGT</text>
<text x="608" y="764.6" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 10 µs</text>
<text x="32" y="784.8" font-size="15" class="fk-f-ink2">Default guard time between two I2C accesses</text>
<text x="32" y="805" font-size="14" class="fk-f-muted">Datasheet UM11225 3.1.1.4 SE I2C Default Values, Table 14, p. 19</text>
<text x="32" y="837.4" font-size="15" font-weight="700" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" class="fk-f-ink">DMPOT</text>
<text x="608" y="837.4" font-size="15" font-weight="700" text-anchor="end" class="fk-f-ink">typ 1 ms</text>
<text x="32" y="857.7" font-size="15" class="fk-f-ink2">Default minimum polling time</text>
<text x="32" y="877.8" font-size="14" class="fk-f-muted">Datasheet UM11225 3.1.1.4 SE I2C Default Values, Table 14, p. 19</text>
<text x="46" y="932" font-size="17" font-weight="700" class="fk-f-slate-text">Notes</text>
<text x="46" y="952.4" font-size="15" class="fk-f-slate-text">In an I-block INF holds the command or response APDU; an R-block has</text>
<text x="46" y="974.1" font-size="15" class="fk-f-slate-text">none. The CRC covers the prologue and INF. A whole block in one I2C</text>
<text x="46" y="995.9" font-size="15" class="fk-f-slate-text">write, START to STOP, never a repeated START. While it works the SE</text>
<text x="46" y="1017.6" font-size="15" class="fk-f-slate-text">NACKs its address; the host polls with one-byte reads, MPOT apart. The</text>
<text x="46" y="1039.4" font-size="15" class="fk-f-slate-text">host may read the prologue first and the rest in a second read.</text>
</svg>

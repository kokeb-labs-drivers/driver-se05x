---
# Model of the figure 't1-i2c-block'. Edit this file; `kokeb-docs figures` draws it. Never edit the SVGs.
# One T=1 block on the I2C bus in the NXP flavour (UM11225 Rev. 1.2): the frame of Figure 4 (host to chip) and of
# Figure 7 (chip to host); the field sizes of Table 1 and 2.1.1, the NAD values of Table 4. Keys: docs/figkit.md.
kind: timing
id: t1-i2c-block
title: One T=1 block each way on I2C
kicker: On the bus
alt: >-
  Two I2C transfers of the NXP T=1 flavour: the host writes a block with NAD, PCB, LEN, the information field and a
  two-byte CRC, and after polling reads the chip's block of the same form.
reads: >-
  The two lanes are Host to SE and SE to Host, each one I2C transfer from START to STOP. Host to SE carries the
  address with the write bit, then NAD, PCB, LEN, INF with the command APDU, CRC-1 and CRC-2. SE to Host carries the
  address with the read bit, then the chip's NAD, PCB, LEN, INF with the response APDU, CRC-1 and CRC-2.
print: landscape
sources:
  - docs/model/t1-i2c-block.timing.yml
bus: transaction
refs:
  um-frame: {doc: um11225, section: "UM11225 2.1 T=1 Block Frame Format, Tables 1 and 4", page: 5}
  um-crc: {doc: um11225, section: "UM11225 2.1.3 Epilogue Field (CRC)", page: 9}
  um-types: {doc: um11225, section: "UM11225 2.1.2 Information Field (INF), Table 10", page: 8}
  um-write: {doc: um11225, section: "UM11225 3.1.1.1 SE I2C Receive State, Figure 4", page: 13}
  um-poll: {doc: um11225, section: "UM11225 3.1.1.2 SE I2C Processing State", page: 14}
  um-read: {doc: um11225, section: "UM11225 3.1.1.3 SE I2C Send State, Figures 7 and 8", page: 15}
  um-defaults: {doc: um11225, section: "UM11225 3.1.1.4 SE I2C Default Values, Table 14", page: 19}
signals:
  - {id: wr, label: Host to SE, wave: "=..=.=.=.=.=.=.",
     data: ["Adr + W", NAD, PCB, LEN, INF, CRC-1, CRC-2]}
  - {id: rd, label: SE to Host, wave: "=..=.=.=.=.=.=.",
     data: ["Adr + R", {text: NAD, tone: teal}, {text: PCB, tone: teal}, {text: LEN, tone: teal},
            {text: INF, tone: teal}, {text: CRC-1, tone: teal}, {text: CRC-2, tone: teal}]}
params:
  - {id: nad, symbol: NAD, label: "Node address: 0x5A host to SE, 0xA5 SE to host", typ: 1, unit: byte, ref: um-frame}
  - {id: pcb, symbol: PCB, label: "Protocol control: I-, R- or S-block", typ: 1, unit: byte, ref: um-frame}
  - {id: len, symbol: LEN, label: Length of INF, typ: 1, unit: byte, ref: um-frame}
  - {id: inf, symbol: INF, label: Information field, min: 0, max: 254, unit: byte, ref: um-frame}
  - {id: crc, symbol: CRC16, label: Error detection code of the block, typ: 2, unit: byte, ref: um-frame}
  - {id: segt, symbol: DSEGT, label: Default guard time between two I2C accesses, typ: 10, unit: µs, ref: um-defaults}
  - {id: mpot, symbol: DMPOT, label: Default minimum polling time, typ: 1, unit: ms, ref: um-defaults}
notes:
  - {text: "In an I-block INF holds the command or response APDU; an R-block has none.", ref: um-types}
  - {text: "The CRC covers the prologue and INF.", ref: um-crc}
  - {text: "A whole block in one I2C write, START to STOP, never a repeated START.", ref: um-write}
  - {text: "While it works the SE NACKs its address; the host polls with one-byte reads, MPOT apart.", ref: um-poll}
  - {text: "The host may read the prologue first and the rest in a second read.", ref: um-read}
